

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" id="metaThemeColor" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="LexiFlash" />
  <title>LexiFlash — Smart Study &amp; AI Flashcards</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234255ff'/%3E%3Cpath d='M18 18h18v10H28v18H18V18zm20 14h10v14H38V32z' fill='%23ffffff'/%3E%3Ccircle cx='43' cy='23' r='5' fill='%23ffcd1f'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f6f7fb; --surface: #ffffff; --surface-secondary: #f0f2f8; --surface-hover: #f8f9fc;
      --border: #edeff4; --border-strong: #d9dde8; --primary: #4255ff; --primary-hover: #2f40d6;
      --primary-soft: rgba(66, 85, 255, .1); --primary-text: #4255ff;
      --yellow: #ffcd1f; --yellow-soft: rgba(255, 205, 31, .18);
      --green: #18ae79; --green-soft: rgba(24, 174, 121, .12);
      --orange: #ff725b; --orange-soft: rgba(255, 114, 91, .12);
      --text: #282e3e; --text-muted: #586380;
      --shadow-sm: 0 2px 8px rgba(40, 46, 62, .05);
      --shadow-md: 0 6px 20px rgba(40, 46, 62, .08);
      --shadow-lg: 0 12px 34px rgba(40, 46, 62, .14);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --font-sans: "Inter", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html[data-theme="dark"] {
      --bg: #0a092d; --surface: #2e3856; --surface-secondary: #1a1d4d; --surface-hover: #364163;
      --border: #3c486b; --border-strong: #4b5882; --primary: #4255ff; --primary-hover: #5869ff;
      --primary-soft: rgba(168, 177, 255, .14); --primary-text: #a8b1ff;
      --yellow-soft: rgba(255, 205, 31, .16);
      --green: #23c78d; --green-soft: rgba(35, 199, 141, .15);
      --orange: #ff7f6b; --orange-soft: rgba(255, 127, 107, .15);
      --text: #f6f7fb; --text-muted: #b8c1d9;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .25);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, .35);
      --shadow-lg: 0 14px 36px rgba(0, 0, 0, .5);
    }

    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 16px; line-height: 1.5; overflow-x: hidden;
      transition: background-color .2s ease, color .2s ease;
    }
    body { padding-bottom: calc(36px + env(safe-area-inset-bottom, 0px)); }
    button, input, select, textarea { font: inherit; color: inherit; }

    button {
      cursor: pointer; border: none; background: none; padding: 0;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
      transition: transform .12s ease, background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;
    }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    svg { flex-shrink: 0; }
    .hidden { display: none !important; }

    /* Header */
    .app-header {
      position: sticky; top: 0; z-index: 90; background: var(--surface);
      border-bottom: 1px solid var(--border); padding: calc(8px + env(safe-area-inset-top, 0px)) 16px 8px;
      box-shadow: var(--shadow-sm);
    }
    .header-inner { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .brand { font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; gap: 10px; padding-right: 4px; }
    .brand-logo {
      width: 36px; height: 36px; border-radius: 10px; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.15rem;
      box-shadow: 0 3px 10px rgba(66, 85, 255, .35);
    }
    .search-box { flex: 1 1 220px; position: relative; display: flex; align-items: center; min-width: 160px; }
    .search-box svg { position: absolute; left: 14px; color: var(--text-muted); pointer-events: none; }
    .search-input {
      width: 100%; height: 44px; padding: 0 38px 0 42px; border-radius: 999px;
      border: 1.5px solid var(--border); background: var(--surface-secondary); font-size: .95rem; outline: none;
      transition: border-color .15s ease, background-color .15s ease;
    }
    .search-input:focus { border-color: var(--primary); background: var(--surface); }
    .search-clear { position: absolute; right: 4px; width: 36px; height: 36px; min-height: 36px; border-radius: 50%; color: var(--text-muted); }
    .header-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    /* Buttons & Badges */
    .btn { padding: 0 16px; height: 44px; min-width: 44px; border-radius: var(--radius-md); font-weight: 600; font-size: .94rem; white-space: nowrap; }
    .btn-sm { height: 38px; min-height: 38px; padding: 0 12px; font-size: .86rem; border-radius: var(--radius-sm); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(66, 85, 255, .25); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary, .btn-icon { background: var(--surface-secondary); border: 1.5px solid var(--border); }
    .btn-secondary:hover:not(:disabled), .btn-icon:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-hover); }
    .btn-outline-primary { background: var(--primary-soft); color: var(--primary-text); border: 1.5px solid transparent; }
    .btn-outline-primary:hover:not(:disabled) { border-color: var(--primary); }
    .btn-danger { background: var(--orange-soft); color: var(--orange); }
    .btn-danger:hover:not(:disabled) { background: var(--orange); color: #fff; }
    .btn-icon { width: 44px; height: 44px; padding: 0; border-radius: var(--radius-md); }
    .btn-ghost { color: var(--text-muted); padding: 0 10px; border-radius: var(--radius-sm); }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-secondary); color: var(--text); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px;
      font-size: .78rem; font-weight: 700; background: var(--surface-secondary); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .badge-primary { background: var(--primary-soft); color: var(--primary-text); border-color: transparent; }
    .badge-green { background: var(--green-soft); color: var(--green); border-color: transparent; }
    .badge-yellow { background: var(--yellow-soft); color: #9b7800; border-color: transparent; }
    html[data-theme="dark"] .badge-yellow { color: var(--yellow); }

    /* Layout & Library */
    .main-container { max-width: 1160px; margin: 0 auto; padding: 20px 16px 40px; }
    .home-hero { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .home-title { margin: 0; font-size: 1.55rem; font-weight: 800; letter-spacing: -.02em; }
    .home-subtitle { margin: 2px 0 0; color: var(--text-muted); font-size: .94rem; }

    .filter-pills { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; scrollbar-width: none; }
    .filter-pills::-webkit-scrollbar { display: none; }
    .pill {
      padding: 0 14px; height: 38px; min-height: 38px; border-radius: 999px; background: var(--surface);
      border: 1.5px solid var(--border); color: var(--text-muted); font-weight: 600; font-size: .88rem; white-space: nowrap;
    }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }

    .sets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .set-card {
      background: var(--surface); border: 1.5px solid var(--border); border-bottom-width: 3px;
      border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 12px;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .set-card:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow-md); }
    .set-card-badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .set-card-title { margin: 0; font-size: 1.15rem; font-weight: 700; line-height: 1.3; cursor: pointer; }
    .set-card-desc {
      margin: 0; font-size: .9rem; color: var(--text-muted);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .progress-wrap { display: flex; flex-direction: column; gap: 5px; }
    .progress-label { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 600; color: var(--text-muted); }
    .progress-track { width: 100%; height: 7px; border-radius: 999px; background: var(--surface-secondary); overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--green); transition: width .3s ease; }
    .set-card-actions { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--border); }
    .set-card-actions .btn-study { flex: 1; }

    .empty-state {
      background: var(--surface); border: 2px dashed var(--border-strong); border-radius: var(--radius-lg);
      padding: 48px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }

    /* Forms & Editor */
    .panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: .82rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
    .input, .select, .textarea {
      width: 100%; padding: 10px 14px; border-radius: var(--radius-md);
      border: 1.5px solid var(--border-strong); background: var(--surface); font-size: .96rem; outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .input, .select { min-height: 44px; }
    .textarea { min-height: 92px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

    .card-editor-row {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg);
      padding: 14px 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s ease;
    }
    .card-editor-row:focus-within { border-color: var(--primary); }
    .card-editor-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .card-num { font-weight: 800; color: var(--text-muted); font-size: .92rem; }
    .card-row-tools { display: flex; align-items: center; gap: 4px; }
    .card-editor-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field-wrap { display: flex; flex-direction: column; gap: 6px; }
    .field-input-row { display: flex; align-items: center; gap: 6px; }
    .line-input {
      flex: 1; width: 100%; min-height: 44px; padding: 8px 2px; border: none;
      border-bottom: 2px solid var(--border-strong); background: transparent; font-size: 1rem; outline: none;
      transition: border-color .15s ease;
    }
    .line-input:focus { border-bottom-color: var(--primary); }
    .field-caption { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); display: flex; justify-content: space-between; }

    .suggest-btn { min-height: 34px; height: 34px; padding: 0 10px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--primary-soft); color: var(--primary-text); }
    .suggest-btn:hover:not(:disabled) { background: var(--primary); color: #fff; }
    .suggestions-tray {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px;
      background: var(--surface-secondary); border-radius: var(--radius-md); border: 1px solid var(--border); align-items: center;
    }
    .suggest-chip {
      min-height: 36px; padding: 6px 12px; border-radius: 999px; background: var(--surface);
      border: 1.5px solid var(--border-strong); font-size: .86rem; font-weight: 600; text-align: left; line-height: 1.3;
    }
    .suggest-chip:hover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }
    .suggest-chip-fix { border-color: var(--yellow); background: var(--yellow-soft); }

    .star-btn.starred { color: var(--yellow); }
    .speak-btn.speaking { color: var(--primary-text); background: var(--primary-soft); animation: pulseSpeak 1s infinite ease-in-out; }
    @keyframes pulseSpeak { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* Switch */
    .switch-label { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-size: .9rem; font-weight: 600; min-height: 44px; user-select: none; }
    .switch { position: relative; width: 46px; height: 26px; background: var(--border-strong); border-radius: 999px; transition: background-color .2s ease; flex-shrink: 0; }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .2s ease;
    }
    .switch-input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-input:checked + .switch { background: var(--primary); }
    .switch-input:checked + .switch::after { transform: translateX(20px); }

    /* Study View */
    .set-top-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
    .mode-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .mode-tab {
      background: var(--surface); border: 1.5px solid var(--border); border-bottom-width: 3px;
      border-radius: var(--radius-md); padding: 12px 14px; font-weight: 700; font-size: .96rem; box-shadow: var(--shadow-sm);
    }
    .mode-tab:hover { border-color: var(--primary); }
    .mode-tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .study-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      margin-bottom: 16px; padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md);
    }

    /* 3D Flashcard */
    .flashcard-stage { perspective: 1100px; width: 100%; max-width: 720px; margin: 0 auto 18px; touch-action: pan-y; }
    .flashcard-3d {
      position: relative; width: 100%; min-height: 320px; height: clamp(300px, 46vh, 420px);
      transform-style: preserve-3d; transition: transform .45s cubic-bezier(.22, 1, .36, 1); cursor: pointer;
    }
    .flashcard-3d.is-flipped { transform: rotateY(180deg); }
    .flashcard-face {
      position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
      background: var(--surface); border: 1.5px solid var(--border); border-radius: 20px;
      box-shadow: var(--shadow-md); padding: 20px 24px; display: flex; flex-direction: column;
    }
    .flashcard-face-back { transform: rotateY(180deg); }
    .flashcard-face-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 2; }
    .flashcard-side-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
    .flashcard-face-tools { display: flex; align-items: center; gap: 6px; }
    .flashcard-content {
      flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
      font-size: clamp(1.35rem, 3.2vw, 2.15rem); font-weight: 700; line-height: 1.35; overflow-y: auto; padding: 12px 6px; word-break: break-word;
    }
    .flashcard-hint { text-align: center; font-size: .8rem; color: var(--text-muted); margin-top: 4px; }
    .flashcard-controls { max-width: 720px; margin: 0 auto 20px; display: flex; flex-direction: column; gap: 12px; }
    .fc-nav-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
    .btn-still-learning, .btn-know {
      flex: 1; max-width: 220px; height: 52px; border-radius: 14px; background: var(--surface); font-weight: 700; font-size: .98rem;
    }
    .btn-still-learning { border: 2px solid var(--orange); color: var(--orange); }
    .btn-still-learning:hover { background: var(--orange-soft); }
    .btn-know { border: 2px solid var(--green); color: var(--green); }
    .btn-know:hover { background: var(--green-soft); }
    .fc-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

    /* Learn & Test */
    .study-card-box {
      max-width: 760px; margin: 0 auto 24px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: var(--shadow-md);
    }
    .mc-options-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 18px; }
    .mc-option {
      min-height: 56px; padding: 12px 16px; border-radius: var(--radius-md); border: 2px solid var(--border-strong);
      background: var(--surface); font-weight: 600; text-align: left; justify-content: flex-start; gap: 12px; line-height: 1.35;
    }
    .mc-option:hover:not(:disabled), .mc-option.selected { border-color: var(--primary); background: var(--primary-soft); }
    .mc-option.selected { color: var(--primary-text); }
    .mc-option.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); }
    .mc-option.incorrect { border-color: var(--orange); background: var(--orange-soft); color: var(--orange); }
    .mc-num {
      width: 28px; height: 28px; border-radius: 50%; background: var(--surface-secondary);
      border: 1px solid var(--border-strong); display: inline-flex; align-items: center; justify-content: center;
      font-size: .82rem; font-weight: 800; flex-shrink: 0;
    }
    .feedback-banner {
      margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-weight: 600;
    }
    .feedback-banner.correct { background: var(--green-soft); border: 1.5px solid var(--green); color: var(--green); }
    .feedback-banner.incorrect { background: var(--orange-soft); border: 1.5px solid var(--orange); color: var(--orange); }
    .feedback-sub { font-size: .86rem; font-weight: 500; margin-top: 4px; opacity: .92; }

    .terms-preview-section { margin-top: 32px; padding-top: 24px; border-top: 1.5px solid var(--border); }
    .term-row-card {
      background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md);
      padding: 14px 16px; display: grid; grid-template-columns: 1fr 1.2fr auto; gap: 14px; align-items: center;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 200; background: rgba(10, 9, 45, .65);
      backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 14px; overflow-y: auto;
    }
    .modal-dialog {
      width: 100%; max-width: 680px; max-height: calc(100vh - 28px); background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 20px; box-shadow: var(--shadow-lg);
      display: flex; flex-direction: column; overflow: hidden; animation: modalIn .18s ease-out;
    }
    .modal-dialog.modal-lg { max-width: 820px; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .modal-title { margin: 0; font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .modal-body { padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }

    /* Camera */
    .camera-box {
      position: relative; width: 100%; aspect-ratio: 4/3; max-height: 55vh; background: #0b0d17;
      border-radius: var(--radius-lg); overflow: hidden; display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--border);
    }
    .camera-video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .camera-overlay-top { position: absolute; top: 12px; right: 12px; left: 12px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .camera-overlay-top > * { pointer-events: auto; }
    .camera-overlay-bottom { position: absolute; bottom: 14px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 20px; padding: 0 16px; }
    .shutter-btn { width: 68px; height: 68px; min-height: 68px; border-radius: 50%; background: rgba(255, 255, 255, .25); border: 4px solid #fff; padding: 5px; box-shadow: 0 4px 16px rgba(0, 0, 0, .4); }
    .shutter-btn::after { content: ""; width: 100%; height: 100%; border-radius: 50%; background: #fff; display: block; }
    .camera-pill-btn { background: rgba(15, 18, 35, .72); color: #fff; border: 1px solid rgba(255, 255, 255, .28); backdrop-filter: blur(6px); border-radius: 999px; padding: 0 14px; height: 42px; min-height: 42px; font-size: .85rem; font-weight: 600; }
    .camera-fallback { position: absolute; inset: 0; padding: 20px; background: rgba(10, 9, 45, .88); color: #f6f7fb; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }

    .dropzone { border: 2px dashed var(--border-strong); border-radius: var(--radius-md); padding: 16px; text-align: center; background: var(--surface-secondary); color: var(--text-muted); font-size: .9rem; transition: border-color .15s ease, background-color .15s ease; }
    .dropzone.dragover { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-text); }
    .captured-preview-img { width: 100%; max-height: 360px; object-fit: contain; border-radius: var(--radius-md); background: #0b0d17; border: 1px solid var(--border); }

    /* Spinner, Toast, Score */
    .spinner { width: 20px; height: 20px; border: 2.5px solid rgba(255, 255, 255, .35); border-top-color: currentColor; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast-container { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 400; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 440px); pointer-events: none; }
    .toast { background: #282e3e; color: #fff; padding: 12px 16px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); font-size: .92rem; font-weight: 600; display: flex; align-items: center; gap: 10px; pointer-events: auto; animation: toastIn .2s ease-out; }
    .toast.toast-success { background: #148a60; }
    .toast.toast-error { background: #d64531; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .score-circle { width: 120px; height: 120px; border-radius: 50%; border: 8px solid var(--primary); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 1.85rem; margin: 0 auto 12px; background: var(--primary-soft); color: var(--primary-text); }

    @media (max-width: 720px) {
      .card-editor-fields, .term-row-card { grid-template-columns: 1fr; gap: 10px; }
      .header-btn-label { display: none; }
      .search-box { order: 3; flex: 1 1 100%; }
      .mode-tab { padding: 10px 6px; font-size: .86rem; }
      .study-card-box { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button type="button" class="brand" id="btnGoHome" aria-label="Go to Library">
        <span class="brand-logo">L</span><span>LexiFlash</span>
      </button>

      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="globalSearchInput" class="search-input" placeholder="Search study sets, tags, terms..." aria-label="Search study sets" />
        <button type="button" id="btnClearSearch" class="search-clear hidden" aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="header-actions">
        <button type="button" id="btnHeaderCreate" class="btn btn-primary" title="Create Study Set">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          <span class="header-btn-label">Create Set</span>
        </button>
        <button type="button" id="btnHeaderScan" class="btn btn-outline-primary" title="Scan Photo with AI">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          <span class="header-btn-label">AI Scan</span>
        </button>
        <button type="button" id="btnThemeToggle" class="btn-icon" title="Toggle Light/Dark Mode" aria-label="Toggle theme">
          <svg id="iconSun" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg id="iconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button type="button" id="btnHeaderTransfer" class="btn-icon" title="Export / Import Backup" aria-label="Export or Import Data">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button type="button" id="btnHeaderSettings" class="btn-icon" title="Settings" aria-label="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

  <main class="main-container" id="mainContainer"></main>

  <div id="scannerModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="scannerModalTitle">
    <div class="modal-dialog modal-lg">
      <div class="modal-header">
        <h2 class="modal-title" id="scannerModalTitle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary-text)" stroke-width="2.2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          AI Photo-to-Flashcard Scanner
        </h2>
        <button type="button" class="btn-ghost" id="btnCloseScanner" aria-label="Close scanner">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>

  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="settingsModalTitle">Settings &amp; Gemini AI</h2>
        <button type="button" class="btn-ghost" id="btnCloseSettings" aria-label="Close settings">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="settingsModalBody"></div>
    </div>
  </div>

  <div id="transferModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="transferModalTitle">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="transferModalTitle">Backup &amp; Transfer Data</h2>
        <button type="button" class="btn-ghost" id="btnCloseTransfer" aria-label="Close backup modal">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body" id="transferModalBody"></div>
    </div>
  </div>

  <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal-dialog" style="max-width:440px;">
      <div class="modal-header"><h2 class="modal-title" id="confirmTitle">Confirm Action</h2></div>
      <div class="modal-body"><p id="confirmMessage" style="margin:0;"></p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="btnConfirmCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="btnConfirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script>
    (() => {
      "use strict";

      /* =====================================================================
         1. CONSTANTS, ICON HELPERS & STATE
      ===================================================================== */
      const STORAGE_KEY_SETS = "lexiflash_sets_v1";
      const STORAGE_KEY_PREFS = "lexiflash_prefs_v1";
      const $ = (id) => document.getElementById(id);

      const LANGUAGES = [
        { code: "en-US", label: "English (US)", short: "EN" },
        { code: "zh-TW", label: "Traditional Chinese (繁體中文)", short: "ZH-TW" },
        { code: "zh-CN", label: "Simplified Chinese (简体中文)", short: "ZH-CN" },
        { code: "ja-JP", label: "Japanese (日本語)", short: "JA" },
        { code: "ko-KR", label: "Korean (한국어)", short: "KO" },
        { code: "es-ES", label: "Spanish (Español)", short: "ES" },
        { code: "fr-FR", label: "French (Français)", short: "FR" },
        { code: "de-DE", label: "German (Deutsch)", short: "DE" },
        { code: "auto", label: "Auto-Detect", short: "AUTO" }
      ];

      const GEMINI_MODELS = [
        { id: "gemini-4-hydrogen", label: "gemini-4-hydrogen (Default — Latest Fast Gemini 4)" },
        { id: "gemini-3.8-flash", label: "gemini-3.8-flash (Fallback)" },
        { id: "gemini-3.5-flash-lite", label: "gemini-3.5-flash-lite (Lightweight High-Speed)" }
      ];

      const DEFAULT_PREFS = {
        theme: "light", apiKey: "", model: "gemini-4-hydrogen",
        speechRate: 1.0, autoSuggest: false, aiGrading: true, voiceOverrides: {}
      };

      const uid = () => "id_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
      const makeCard = (term = "", def = "", starred = false) => ({ id: uid(), term, def, starred, mastery: 0 });
      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      const svgIcon = (name, size = 18, filled = false) => {
        const paths = {
          speaker: `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>`,
          star: `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`,
          camera: `<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>`,
          back: `<path d="m15 18-6-6 6-6"/>`,
          plus: `<path d="M12 5v14M5 12h14"/>`,
          edit: `<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>`,
          trash: `<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>`,
          up: `<path d="m18 15-6-6-6 6"/>`,
          down: `<path d="m6 9 6 6 6-6"/>`
        };
        return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${paths[name]}</svg>`;
      };

      function createSampleSet() {
        const now = Date.now();
        return {
          id: "sample_en_zhtw_1",
          title: "Essential Academic & Daily English (核心詞彙)",
          description: "High-frequency vocabulary — see the Chinese definition and recall the English word.",
          folder: "English Vocab",
          termLang: "en-US",
          defLang: "zh-TW",
          createdAt: now,
          updatedAt: now,
          cards: [
            makeCard("resilient", "(adj.) 有韌性的；能迅速恢復的", true),
            makeCard("ubiquitous", "(adj.) 無所不在的；普遍存在的"),
            makeCard("pragmatic", "(adj.) 務實的；講求實效的", true),
            makeCard("articulate", "(adj./v.) 口齒伶俐的；清楚表達"),
            makeCard("mitigate", "(v.) 減輕；緩和（傷害或風險）"),
            makeCard("serendipity", "(n.) 意外發現珍奇事物的運氣；機緣巧合")
          ]
        };
      }

      const state = {
        sets: [],
        prefs: { ...DEFAULT_PREFS },
        view: "home",
        searchQuery: "",
        activeFolder: "ALL",
        editor: {
          editingSetId: null, title: "", description: "", folder: "",
          termLang: "en-US", defLang: "zh-TW", cards: [],
          showBulkImport: false, bulkText: "", suggestionsByCardId: {}, debounceTimers: {}
        },
        study: {
          setId: null, mode: "flashcards", starredOnly: false,
          fc: { deckIds: [], index: 0, flipped: false, swapFrontBack: true, trackProgress: true, autoPlayAudio: false, knowIds: [], learningIds: [], finished: false },
          learn: { roundIds: [], queueIds: [], currentCardId: null, questionType: "mc", mcOptions: [], selectedOption: null, writtenInput: "", checkingAi: false, aiError: null, feedback: null, roundCorrect: 0, roundAttempts: 0, roundComplete: false, promptSide: "def" },
          test: { phase: "setup", gradingAi: false, config: { count: 6, direction: "term", types: { mc: true, written: true, tf: true } }, questions: [], userAnswers: {}, results: null }
        },
        scanner: {
          open: false, step: "capture", facingMode: "environment", stream: null, cameraError: "",
          imageDataUrl: "", mode: "auto", termLang: "en-US", defLang: "zh-TW",
          extracting: false, extractError: "", extractedCards: [], targetSetId: null
        }
      };

      /* =====================================================================
         2. PERSISTENCE, NORMALIZATION & UI HELPERS
      ===================================================================== */
      function loadData() {
        try {
          const rawPrefs = localStorage.getItem(STORAGE_KEY_PREFS);
          if (rawPrefs) {
            state.prefs = { ...DEFAULT_PREFS, ...JSON.parse(rawPrefs) };
            if (!state.prefs.voiceOverrides || typeof state.prefs.voiceOverrides !== "object") state.prefs.voiceOverrides = {};
          }
        } catch (e) { console.warn("Failed to parse prefs:", e); }

        try {
          const rawSets = localStorage.getItem(STORAGE_KEY_SETS);
          const parsed = rawSets !== null ? JSON.parse(rawSets) : null;
          if (Array.isArray(parsed)) state.sets = parsed;
          else { state.sets = [createSampleSet()]; saveSets(); }
        } catch (e) {
          console.warn("Failed to parse sets:", e);
          state.sets = [createSampleSet()];
        }
        applyTheme(state.prefs.theme);
      }

      function saveSets() {
        try { localStorage.setItem(STORAGE_KEY_SETS, JSON.stringify(state.sets)); }
        catch { showToast("Storage full! Consider exporting a backup.", "error"); }
      }

      function savePrefs() {
        try { localStorage.setItem(STORAGE_KEY_PREFS, JSON.stringify(state.prefs)); }
        catch (e) { console.warn("Could not save prefs", e); }
      }

      function applyTheme(theme) {
        const t = theme === "dark" ? "dark" : "light";
        state.prefs.theme = t;
        document.documentElement.setAttribute("data-theme", t);
        $("metaThemeColor")?.setAttribute("content", t === "dark" ? "#0a092d" : "#f6f7fb");
        $("iconSun")?.classList.toggle("hidden", t !== "dark");
        $("iconMoon")?.classList.toggle("hidden", t === "dark");
      }

      const escapeHtml = (str) => String(str ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      const getLangInfo = (code) => LANGUAGES.find(l => l.code === code) || { code, label: code, short: code.toUpperCase() };
      const langOpts = (selected) => LANGUAGES.map(l => `<option value="${escapeHtml(l.code)}" ${l.code === selected ? "selected" : ""}>${escapeHtml(l.label)}</option>`).join("");
      const getSetById = (id) => state.sets.find(s => s.id === id) || null;

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      const stripAnnotations = (str) => String(str || "")
        .replace(/\([^)]*\)/g, " ").replace(/（[^）]*）/g, " ").replace(/\[[^\]]*\]/g, " ")
        .replace(/\b(?:n|v|vt|vi|adj|adv|prep|conj|pron|interj)\.\s*/gi, " ");

      const normalizeAnswer = (str) => stripAnnotations(str).toLowerCase().trim()
        .replace(/[.,!?;:'"()（）「」『』、。！？；：·~～\-–—]/g, "").replace(/\s+/g, " ").trim();

      function isLocallyAcceptable(userAnswer, expectedAnswer) {
        const uNorm = normalizeAnswer(userAnswer);
        if (!uNorm) return false;
        if (uNorm === normalizeAnswer(expectedAnswer)) return true;
        return stripAnnotations(expectedAnswer).split(/[;；/、,，]/).some(v => normalizeAnswer(v) === uNorm);
      }

      function buildMcOptions(allCards, excludeCardId, askDef, answerText) {
        const seen = new Set([normalizeAnswer(answerText)]);
        const distractors = [];
        for (const c of shuffleArray(allCards)) {
          if (c.id === excludeCardId) continue;
          const txt = askDef ? c.def : c.term;
          const norm = normalizeAnswer(txt);
          if (txt && !seen.has(norm)) {
            seen.add(norm);
            distractors.push(txt);
            if (distractors.length === 3) break;
          }
        }
        return shuffleArray([answerText, ...distractors]);
      }

      function showToast(message, type = "info") {
        const el = document.createElement("div");
        el.className = `toast ${type === "success" ? "toast-success" : type === "error" ? "toast-error" : ""}`;
        el.textContent = message;
        $("toastContainer").appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity .2s ease";
          setTimeout(() => el.remove(), 220);
        }, 3200);
      }

      function showConfirm(title, message, okLabel = "Confirm", isDanger = true) {
        return new Promise((resolve) => {
          const modal = $("confirmModal"), okBtn = $("btnConfirmOk"), cancelBtn = $("btnConfirmCancel");
          $("confirmTitle").textContent = title;
          $("confirmMessage").textContent = message;
          okBtn.textContent = okLabel;
          okBtn.className = isDanger ? "btn btn-danger" : "btn btn-primary";
          modal.classList.remove("hidden");
          const done = (res) => {
            modal.classList.add("hidden");
            okBtn.onclick = cancelBtn.onclick = null;
            resolve(res);
          };
          okBtn.onclick = () => done(true);
          cancelBtn.onclick = () => done(false);
        });
      }

      /* =====================================================================
         3. WEB SPEECH API (CLEANUP & SMART VOICE SELECTION)
      ===================================================================== */
      let cachedVoices = [];
      let currentUtterance = null;

      function loadVoices() {
        if ("speechSynthesis" in window) cachedVoices = window.speechSynthesis.getVoices() || [];
      }
      if ("speechSynthesis" in window) {
        loadVoices();
        window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
      }

      function cleanTextForSpeech(rawText) {
        let s = String(rawText || "").trim()
          .replace(/\([^)]*\)/g, " ").replace(/（[^）]*）/g, " ")
          .replace(/\[[^\]]*\]/g, " ").replace(/【[^】]*】/g, " ")
          .replace(/^(?:n|v|vt|vi|adj|adv|prep|conj|pron|interj|phr)\.\s*/i, "")
          .replace(/[;；/]+/g, "，").replace(/\s+/g, " ").replace(/^[，,\s]+|[，,\s]+$/g, "").trim();
        return s || String(rawText || "").replace(/[()（）[\]【】]/g, "").trim();
      }

      function detectTextLang(text, fallback = "en-US") {
        if (fallback && fallback !== "auto") return fallback;
        if (/[\u3040-\u30ff]/.test(text)) return "ja-JP";
        if (/[\uac00-\ud7af]/.test(text)) return "ko-KR";
        if (/[\u4e00-\u9fff]/.test(text)) return "zh-TW";
        return "en-US";
      }

      const normalizeVoiceLang = (lang) => String(lang || "").replace(/_/g, "-").toLowerCase().trim();

      function scoreVoice(voice, targetLang) {
        const vLang = normalizeVoiceLang(voice.lang);
        const vName = (voice.name || "").toLowerCase();
        const tLang = normalizeVoiceLang(targetLang);
        const tBase = tLang.split("-")[0];
        let score = 0;

        if (tBase === "zh" || tBase === "cmn") {
          const isCantonese = /hk|yue|cantonese|hong kong|粵|香港/.test(vLang + " " + vName);
          if (isCantonese) return -1000;
          if (tLang === "zh-tw") {
            if (["zh-tw", "cmn-hant-tw", "cmn-tw"].includes(vLang)) score += 200;
            else if (["zh-cn", "cmn-hans-cn", "cmn-cn", "zh"].includes(vLang)) score += 40;
            else return -1000;
            if (/taiwan|臺灣|台灣|國語|hsiaochen|hsiaoyu|yunjhe|meijia|yating|hanhan|zhiwei/.test(vName)) score += 80;
          } else {
            if (vLang === tLang || vLang === "cmn-hans-cn") score += 200;
            else if (vLang.startsWith("zh") || vLang.startsWith("cmn")) score += 60;
            else return -1000;
          }
        } else {
          if (vLang === tLang) score += 200;
          else if (vLang.startsWith(tBase + "-") || vLang === tBase) score += 80;
          else return -1000;
        }

        if (/natural|neural|online|google|wavenet|studio|enhanced|premium|siri/.test(vName)) score += 70;
        if (/espeak|festival/.test(vName)) score -= 80;
        return score;
      }

      function pickBestVoice(langCode) {
        if (!cachedVoices.length) loadVoices();
        if (!cachedVoices.length) return null;
        const overrides = state.prefs.voiceOverrides || {};
        const overrideName = overrides[langCode] || overrides[normalizeVoiceLang(langCode)];
        if (overrideName) {
          const manual = cachedVoices.find(v => v.name === overrideName);
          if (manual) return manual;
        }
        let best = null, bestScore = -999;
        for (const v of cachedVoices) {
          const sc = scoreVoice(v, langCode);
          if (sc > bestScore) { bestScore = sc; best = v; }
        }
        return best;
      }

      function speakText(rawText, langCode, btnEl = null) {
        const text = cleanTextForSpeech(rawText);
        if (!text) return;
        if (!("speechSynthesis" in window)) return showToast("Text-to-Speech is not supported on this browser.", "error");

        document.querySelectorAll(".speak-btn.speaking").forEach(b => b.classList.remove("speaking"));
        window.speechSynthesis.cancel();

        const resolvedLang = detectTextLang(text, langCode);
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = resolvedLang;
        utter.rate = Number(state.prefs.speechRate) || 1.0;

        const voice = pickBestVoice(resolvedLang);
        if (voice) {
          utter.voice = voice;
          if (voice.lang) utter.lang = voice.lang;
        }

        const clearSpeak = () => { btnEl?.classList.remove("speaking"); currentUtterance = null; };
        btnEl?.classList.add("speaking");
        utter.onend = utter.onerror = clearSpeak;
        currentUtterance = utter;

        setTimeout(() => {
          try { window.speechSynthesis.speak(utter); }
          catch { clearSpeak(); }
        }, 30);
      }

      /* =====================================================================
         4. GEMINI API CLIENT & AI HELPERS (AUTO-RETRY ON TRAFFIC)
      ===================================================================== */
      function parseGeminiJson(rawText) {
        let cleaned = String(rawText || "").trim();
        if (cleaned.startsWith("```")) cleaned = cleaned.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
        return JSON.parse(cleaned);
      }

      function isTransientTrafficError(status, msg, isNetworkError) {
        if (isNetworkError && navigator.onLine !== false) return true;
        if ([408, 429, 500, 502, 503, 504].includes(status)) return true;
        return /overload|high demand|traffic|too many|rate limit|resource.?exhausted|unavailable|temporarily|capacity|timeout|try again|busy/i.test(msg || "");
      }

      async function callGemini({ parts, expectJson = true, maxRetries = 2 }) {
        const apiKey = (state.prefs.apiKey || "").trim();
        if (!apiKey) throw new Error("MISSING_KEY");
        if (!navigator.onLine) throw new Error("You appear to be offline. Please check your internet connection.");

        const model = state.prefs.model || "gemini-4-hydrogen";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const payload = { contents: [{ role: "user", parts }] };
        if (expectJson) payload.generationConfig = { responseMimeType: "application/json" };

        let lastError = null;

        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          let res = null;
          let status = 0;
          let apiMsg = "";
          let isNetworkError = false;

          try {
            res = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            status = res.status;

            if (!res.ok) {
              try { apiMsg = (await res.json())?.error?.message || ""; } catch {}

              if ([400, 401, 403].includes(status) && !isTransientTrafficError(status, apiMsg, false)) {
                throw new Error(`API key or request rejected (${status}). ${apiMsg || "Check your Gemini API key in Settings."}`);
              }

              const reason = status === 429
                ? "High traffic / rate limit (HTTP 429)"
                : status === 503
                ? "AI server overloaded (HTTP 503)"
                : `Server error (HTTP ${status})`;
              const err = new Error(apiMsg ? `${reason}: ${apiMsg}` : `${reason}. Please try again.`);
              err.status = status;
              err.transient = isTransientTrafficError(status, apiMsg, false);
              throw err;
            }

            const data = await res.json();
            const candidate = data?.candidates?.[0];
            const text = candidate?.content?.parts?.[0]?.text;

            if (!text) {
              const finishReason = candidate?.finishReason || "";
              const blocked = ["SAFETY", "RECITATION", "PROHIBITED_CONTENT"].includes(finishReason);
              const err = new Error(blocked
                ? `Gemini blocked the response (${finishReason}). Try adjusting your input.`
                : "Gemini returned an empty response under load.");
              err.transient = !blocked;
              throw err;
            }

            return expectJson ? parseGeminiJson(text) : text;
          } catch (err) {
            if (err instanceof TypeError || err.name === "AbortError") {
              isNetworkError = true;
            }
            const msg = err?.message || "Network error";
            const transient = Boolean(err?.transient) || isTransientTrafficError(status, msg, isNetworkError);
            lastError = err;

            if (transient && attempt < maxRetries) {
              let delayMs = 1100 * (attempt + 1) + Math.floor(Math.random() * 400);
              const retryAfter = res?.headers?.get?.("Retry-After");
              if (retryAfter && /^\d+$/.test(retryAfter.trim())) {
                delayMs = Math.min(6000, Math.max(800, Number(retryAfter.trim()) * 1000));
              }
              const shortReason = status ? `HTTP ${status}` : "busy";
              showToast(`AI server busy (${shortReason}). Retrying (${attempt + 1}/${maxRetries})...`, "info");
              await sleep(delayMs);
              continue;
            }
            throw lastError;
          }
        }
        throw lastError || new Error("AI request failed.");
      }

      async function gradeWrittenWithAi({ promptText, promptLang, answerText, answerLang, userAnswer }) {
        const prompt = `You are a fair, encouraging bilingual flashcard grader.
Question shown to student (${getLangInfo(promptLang).label}): "${promptText}"
Expected reference answer (${getLangInfo(answerLang).label}): "${answerText}"
Student's typed answer: "${userAnswer}"

Decide if the student's answer demonstrates they know the meaning/word.
Be forgiving of:
- Missing part-of-speech tags like (n.), (v.), (adj.)
- Valid synonyms or closely equivalent translations/word forms (e.g. "to mitigate" for "mitigate", or a valid Chinese/English synonym)
- Minor single-letter typos if the intended word is obvious
Mark FALSE if the student typed a completely wrong word, wrong meaning, or gibberish.

Return strictly valid JSON:
{
  "correct": true or false,
  "feedback": "Very concise 5-14 word explanation"
}`;
        const res = await callGemini({ parts: [{ text: prompt }], expectJson: true });
        return { correct: Boolean(res?.correct), feedback: String(res?.feedback || "").trim() };
      }

      async function batchGradeWrittenTestWithAi(items) {
        const prompt = `You are a fair bilingual flashcard exam grader. Grade each student written answer below.
Be forgiving of missing part-of-speech tags like (n.), minor typos, infinitive "to", or valid synonyms/translations matching the question.
Mark FALSE if the meaning is wrong or blank.

Items:
${JSON.stringify(items.map(it => ({ id: it.id, question: it.prompt, expected: it.correctAnswer, studentAnswer: it.userAnswer })))}

Return strictly valid JSON with this exact schema:
{
  "results": [
    { "id": "matching item id", "correct": true or false, "feedback": "short 4-10 word note" }
  ]
}`;
        const res = await callGemini({ parts: [{ text: prompt }], expectJson: true });
        const map = {};
        if (Array.isArray(res?.results)) {
          for (const r of res.results) {
            if (r?.id) map[r.id] = { correct: Boolean(r.correct), feedback: String(r.feedback || "").trim() };
          }
        }
        return map;
      }

      async function requestCardSuggestions(cardId, direction = "termToDef") {
        const card = state.editor.cards.find(c => c.id === cardId);
        if (!card) return;
        const sourceText = (direction === "termToDef" ? card.term : card.def).trim();
        if (!sourceText) return showToast(direction === "termToDef" ? "Type a term first to get suggestions." : "Type a definition first.", "error");

        state.editor.suggestionsByCardId[cardId] = { loading: true, error: "", direction, autocomplete: "", items: [] };
        renderEditorSuggestions(cardId);

        const termLangLabel = getLangInfo(state.editor.termLang).label;
        const defLangLabel = getLangInfo(state.editor.defLang).label;
        const prompt = direction === "termToDef"
          ? `You are a concise bilingual flashcard assistant.
Source Term: "${sourceText}" (Language: ${termLangLabel})
Target Definition Language: ${defLangLabel}

Return strictly valid JSON with this exact schema:
{
  "autocomplete": "If the source term has a typo or looks incomplete, provide the corrected/completed word or phrase in ${termLangLabel}; otherwise empty string ''",
  "suggestions": [
    "3 to 4 concise, accurate definitions/translations in ${defLangLabel} (include brief part-of-speech like (n.) or (v.) when helpful, keep each item short enough for a flashcard)"
  ]
}`
          : `You are a concise bilingual flashcard assistant.
Given Definition: "${sourceText}" (Language: ${defLangLabel})
Target Term Language: ${termLangLabel}

Return strictly valid JSON with this exact schema:
{
  "autocomplete": "",
  "suggestions": [
    "3 to 4 concise matching terms/words/phrases in ${termLangLabel}"
  ]
}`;

        try {
          const res = await callGemini({ parts: [{ text: prompt }], expectJson: true });
          state.editor.suggestionsByCardId[cardId] = {
            loading: false, error: "", direction,
            autocomplete: typeof res.autocomplete === "string" ? res.autocomplete.trim() : "",
            items: Array.isArray(res.suggestions) ? res.suggestions.slice(0, 4).map(String) : []
          };
        } catch (err) {
          state.editor.suggestionsByCardId[cardId] = {
            loading: false, direction, autocomplete: "", items: [],
            error: err.message === "MISSING_KEY" ? "Add your Gemini API key in Settings (⚙️) to use AI suggestions." : err.message
          };
        }
        renderEditorSuggestions(cardId);
      }
