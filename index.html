          };
        }

        container.querySelector("#btnAddCard").onclick = () => addEditorCard(true);
        renderEditorCards();
      }

      function addEditorCard(focusNew = false) {
        const newCard = makeCard();
        state.editor.cards.push(newCard);
        renderEditorCards();
        const saveBtn = $("btnSaveSetBottom");
        if (saveBtn) saveBtn.textContent = `Save Study Set (${state.editor.cards.length} cards)`;
        if (focusNew) document.querySelector(`[data-term-input="${newCard.id}"]`)?.focus();
      }

      function renderEditorCards() {
        const listEl = $("editorCardsList");
        if (!listEl) return;
        const ed = state.editor;
        const termLangAttr = ed.termLang === "auto" ? "" : `lang="${escapeHtml(ed.termLang)}"`;
        const defLangAttr = ed.defLang === "auto" ? "" : `lang="${escapeHtml(ed.defLang)}"`;

        listEl.innerHTML = ed.cards.map((card, idx) => `
          <div class="card-editor-row" data-card-row="${escapeHtml(card.id)}">
            <div class="card-editor-header">
              <span class="card-num">${idx + 1}</span>
              <div class="card-row-tools">
                <button type="button" class="btn-ghost btn-sm star-btn ${card.starred ? "starred" : ""}" data-card-star="${escapeHtml(card.id)}" title="Star card">${svgIcon("star", 18, card.starred)}</button>
                <button type="button" class="btn-ghost btn-sm" data-card-up="${escapeHtml(card.id)}" ${idx === 0 ? "disabled" : ""} title="Move up" aria-label="Move card up">${svgIcon("up", 18)}</button>
                <button type="button" class="btn-ghost btn-sm" data-card-down="${escapeHtml(card.id)}" ${idx === ed.cards.length - 1 ? "disabled" : ""} title="Move down" aria-label="Move card down">${svgIcon("down", 18)}</button>
                <button type="button" class="btn-ghost btn-sm" data-card-del="${escapeHtml(card.id)}" title="Delete card" aria-label="Delete card" style="color:var(--orange);">${svgIcon("trash", 18)}</button>
              </div>
            </div>
            <div class="card-editor-fields">
              <div class="field-wrap">
                <div class="field-input-row">
                  <input type="text" class="line-input" ${termLangAttr} data-term-input="${escapeHtml(card.id)}" value="${escapeHtml(card.term)}" placeholder="Enter term..." />
                  <button type="button" class="btn-ghost btn-sm speak-btn" data-speak-term="${escapeHtml(card.id)}" title="Listen to term" aria-label="Speak term">${svgIcon("speaker", 18)}</button>
                  <button type="button" class="suggest-btn" data-suggest-term="${escapeHtml(card.id)}" title="Suggest Term from Definition">✨</button>
                </div>
                <div class="field-caption"><span>TERM (${escapeHtml(getLangInfo(ed.termLang).short)})</span></div>
              </div>
              <div class="field-wrap">
                <div class="field-input-row">
                  <input type="text" class="line-input" ${defLangAttr} data-def-input="${escapeHtml(card.id)}" value="${escapeHtml(card.def)}" placeholder="Enter definition..." />
                  <button type="button" class="btn-ghost btn-sm speak-btn" data-speak-def="${escapeHtml(card.id)}" title="Listen to definition" aria-label="Speak definition">${svgIcon("speaker", 18)}</button>
                  <button type="button" class="suggest-btn" data-suggest-def="${escapeHtml(card.id)}" title="AI Suggest Definition">✨ Suggest</button>
                </div>
                <div class="field-caption"><span>DEFINITION (${escapeHtml(getLangInfo(ed.defLang).short)})</span></div>
              </div>
            </div>
            <div id="suggestions_${escapeHtml(card.id)}"></div>
          </div>
        `).join("");

        ed.cards.forEach((card, idx) => {
          const termInp = listEl.querySelector(`[data-term-input="${card.id}"]`);
          const defInp = listEl.querySelector(`[data-def-input="${card.id}"]`);

          termInp.oninput = (e) => {
            card.term = e.target.value;
            if (state.prefs.autoSuggest) {
              clearTimeout(ed.debounceTimers[card.id]);
              if (card.term.trim().length >= 2 && !card.def.trim()) {
                ed.debounceTimers[card.id] = setTimeout(() => requestCardSuggestions(card.id, "termToDef"), 800);
              }
            }
          };
          termInp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); defInp.focus(); } };
          defInp.oninput = (e) => { card.def = e.target.value; };
          defInp.onkeydown = (e) => {
            if (e.key === "Enter" || (e.key === "Tab" && !e.shiftKey && idx === ed.cards.length - 1)) {
              if (idx === ed.cards.length - 1) { e.preventDefault(); addEditorCard(true); }
              else if (e.key === "Enter") { e.preventDefault(); listEl.querySelector(`[data-term-input="${ed.cards[idx + 1].id}"]`)?.focus(); }
            }
          };

          listEl.querySelector(`[data-card-star="${card.id}"]`).onclick = () => { card.starred = !card.starred; renderEditorCards(); };
          listEl.querySelector(`[data-card-up="${card.id}"]`).onclick = () => {
            if (idx > 0) { [ed.cards[idx - 1], ed.cards[idx]] = [ed.cards[idx], ed.cards[idx - 1]]; renderEditorCards(); }
          };
          listEl.querySelector(`[data-card-down="${card.id}"]`).onclick = () => {
            if (idx < ed.cards.length - 1) { [ed.cards[idx + 1], ed.cards[idx]] = [ed.cards[idx], ed.cards[idx + 1]]; renderEditorCards(); }
          };
          listEl.querySelector(`[data-card-del="${card.id}"]`).onclick = () => {
            if (ed.cards.length <= 1) { card.term = card.def = ""; return renderEditorCards(); }
            ed.cards.splice(idx, 1);
            renderEditorCards();
            const saveBtn = $("btnSaveSetBottom");
            if (saveBtn) saveBtn.textContent = `Save Study Set (${ed.cards.length} cards)`;
          };
          listEl.querySelector(`[data-speak-term="${card.id}"]`).onclick = (e) => speakText(card.term, ed.termLang, e.currentTarget);
          listEl.querySelector(`[data-speak-def="${card.id}"]`).onclick = (e) => speakText(card.def, ed.defLang, e.currentTarget);
          listEl.querySelector(`[data-suggest-def="${card.id}"]`).onclick = () => requestCardSuggestions(card.id, "termToDef");
          listEl.querySelector(`[data-suggest-term="${card.id}"]`).onclick = () => requestCardSuggestions(card.id, "defToTerm");
          renderEditorSuggestions(card.id);
        });
      }

      function renderEditorSuggestions(cardId) {
        const trayHost = $(`suggestions_${cardId}`);
        const sug = state.editor.suggestionsByCardId[cardId];
        if (!trayHost) return;
        if (!sug) { trayHost.innerHTML = ""; return; }

        if (sug.loading) {
          trayHost.innerHTML = `<div class="suggestions-tray"><div class="spinner" style="color:var(--primary-text);"></div><span style="font-size:.86rem; color:var(--text-muted); font-weight:600;">Asking Gemini for concise suggestions...</span></div>`;
          return;
        }
        if (sug.error) {
          trayHost.innerHTML = `
            <div class="suggestions-tray" style="border-color:var(--orange); background:var(--orange-soft); color:var(--orange); justify-content:space-between;">
              <span style="font-size:.86rem; font-weight:600; flex:1 1 200px;">${escapeHtml(sug.error)}</span>
              <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                <button type="button" class="btn btn-primary btn-sm" data-retry-sug="${escapeHtml(cardId)}">↻ Recall AI</button>
                <button type="button" class="btn-ghost btn-sm" data-dismiss-sug="${escapeHtml(cardId)}">Dismiss</button>
              </div>
            </div>`;
          trayHost.querySelector("[data-retry-sug]").onclick = () => requestCardSuggestions(cardId, sug.direction || "termToDef");
          trayHost.querySelector("[data-dismiss-sug]").onclick = () => { delete state.editor.suggestionsByCardId[cardId]; renderEditorSuggestions(cardId); };
          return;
        }
        if (!sug.autocomplete && !sug.items?.length) { trayHost.innerHTML = ""; return; }

        trayHost.innerHTML = `
          <div class="suggestions-tray">
            <span style="font-size:.78rem; font-weight:800; color:var(--primary-text); text-transform:uppercase;">✨ AI Picks:</span>
            ${sug.autocomplete ? `<button type="button" class="suggest-chip suggest-chip-fix" data-apply-auto="${escapeHtml(cardId)}">Fix term → <strong>${escapeHtml(sug.autocomplete)}</strong></button>` : ""}
            ${sug.items.map((item, i) => `<button type="button" class="suggest-chip" data-apply-sug="${i}">${escapeHtml(item)}</button>`).join("")}
            <button type="button" class="btn-ghost btn-sm" style="margin-left:auto;" data-close-sug="${escapeHtml(cardId)}" aria-label="Close suggestions">✕</button>
          </div>
        `;

        const card = state.editor.cards.find(c => c.id === cardId);
        if (!card) return;

        trayHost.querySelector(`[data-apply-auto="${cardId}"]`)?.addEventListener("click", () => {
          card.term = sug.autocomplete;
          const inp = document.querySelector(`[data-term-input="${cardId}"]`);
          if (inp) inp.value = sug.autocomplete;
          sug.autocomplete = "";
          renderEditorSuggestions(cardId);
        });
        trayHost.querySelectorAll("[data-apply-sug]").forEach(btn => btn.onclick = () => {
          const val = sug.items[Number(btn.dataset.applySug)];
          const isTerm = sug.direction === "defToTerm";
          card[isTerm ? "term" : "def"] = val;
          const inp = document.querySelector(`[data-${isTerm ? "term" : "def"}-input="${cardId}"]`);
          if (inp) inp.value = val;
          delete state.editor.suggestionsByCardId[cardId];
          renderEditorSuggestions(cardId);
        });
        trayHost.querySelector("[data-close-sug]").onclick = () => { delete state.editor.suggestionsByCardId[cardId]; renderEditorSuggestions(cardId); };
      }

      function saveEditorSet() {
        const ed = state.editor;
        const cleanTitle = ed.title.trim() || "Untitled Study Set";
        const validCards = ed.cards.map(c => ({ ...c, term: c.term.trim(), def: c.def.trim() })).filter(c => c.term || c.def);
        if (!validCards.length) return showToast("Please add at least one card with a term or definition.", "error");

        const payload = {
          title: cleanTitle, description: ed.description.trim(), folder: ed.folder.trim(),
          termLang: ed.termLang, defLang: ed.defLang, updatedAt: Date.now(), cards: validCards
        };
        let targetId = ed.editingSetId;
        if (targetId) {
          const idx = state.sets.findIndex(s => s.id === targetId);
          if (idx !== -1) state.sets[idx] = { ...state.sets[idx], ...payload };
          showToast("Study set updated!", "success");
        } else {
          targetId = uid();
          state.sets.unshift({ id: targetId, createdAt: Date.now(), ...payload });
          showToast("Study set created!", "success");
        }
        saveSets();
        openSetView(targetId);
      }

      /* =====================================================================
         7. STUDY VIEW (FLASHCARDS, LEARN, TEST & TERMS LIST)
      ===================================================================== */
      function openSetView(setId, mode = "flashcards") {
        const set = getSetById(setId);
        if (!set) { state.view = "home"; return render(); }
        Object.assign(state.study, { setId, mode, starredOnly: false });
        initFlashcardsDeck(set);
        initLearnSession(set);
        initTestSetup(set);
        state.view = "set";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function getActiveStudyCards(set) {
        if (!set) return [];
        return state.study.starredOnly ? set.cards.filter(c => c.starred) : set.cards;
      }

      function renderSetView(container) {
        const set = getSetById(state.study.setId);
        if (!set) { state.view = "home"; return render(); }

        const starredCount = set.cards.filter(c => c.starred).length;
        const activeCards = getActiveStudyCards(set);

        container.innerHTML = `
          <div class="set-top-bar">
            <div>
              <button type="button" class="btn btn-ghost btn-sm" id="btnSetBack" style="padding-left:0; margin-bottom:4px;">${svgIcon("back", 18)} Library</button>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;">
                <span class="badge badge-primary">${set.cards.length} terms</span>
                <span class="badge">${escapeHtml(getLangInfo(set.defLang).short)} → ${escapeHtml(getLangInfo(set.termLang).short)}</span>
                ${set.folder ? `<span class="badge badge-yellow">${escapeHtml(set.folder)}</span>` : ""}
              </div>
              <h1 class="home-title">${escapeHtml(set.title)}</h1>
              ${set.description ? `<p class="home-subtitle">${escapeHtml(set.description)}</p>` : ""}
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn btn-outline-primary btn-sm" id="btnSetScanAdd">📷 Scan &amp; Add</button>
              <button type="button" class="btn btn-secondary btn-sm" id="btnSetEdit">Edit Set</button>
            </div>
          </div>

          <div class="mode-tabs" role="tablist" aria-label="Study modes">
            <button type="button" class="mode-tab ${state.study.mode === "flashcards" ? "active" : ""}" data-study-mode="flashcards">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="5" width="16" height="14" rx="2"/><path d="M22 9v8a2 2 0 0 1-2 2H8"/></svg> Flashcards
            </button>
            <button type="button" class="mode-tab ${state.study.mode === "learn" ? "active" : ""}" data-study-mode="learn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Learn
            </button>
            <button type="button" class="mode-tab ${state.study.mode === "test" ? "active" : ""}" data-study-mode="test">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Test
            </button>
          </div>

          <div class="study-toolbar">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              <button type="button" class="pill ${!state.study.starredOnly ? "active" : ""}" id="btnFilterAll">Study All (${set.cards.length})</button>
              <button type="button" class="pill ${state.study.starredOnly ? "active" : ""}" id="btnFilterStarred" ${starredCount === 0 ? "disabled" : ""}>★ Starred Only (${starredCount})</button>
            </div>
            <span style="font-size:.84rem; color:var(--text-muted); font-weight:600;">${activeCards.length} active ${activeCards.length === 1 ? "card" : "cards"}</span>
          </div>

          <div id="studyModeStage"></div>

          <section class="terms-preview-section">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
              <h2 style="margin:0; font-size:1.2rem; font-weight:800;">Terms in this set (${set.cards.length})</h2>
              <button type="button" class="btn btn-secondary btn-sm" id="btnResetSetMastery">Reset Mastery Progress</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${set.cards.map(c => `
                <div class="term-row-card">
                  <div style="font-weight:700; display:flex; align-items:center; gap:8px; justify-content:space-between;">
                    <span lang="${escapeHtml(set.termLang)}">${escapeHtml(c.term)}</span>
                    <button type="button" class="btn-ghost btn-sm speak-btn" data-list-speak-term="${escapeHtml(c.id)}" aria-label="Speak term">${svgIcon("speaker", 17)}</button>
                  </div>
                  <div style="color:var(--text-muted); display:flex; align-items:center; gap:8px; justify-content:space-between;">
                    <span lang="${escapeHtml(set.defLang)}">${escapeHtml(c.def)}</span>
                    <button type="button" class="btn-ghost btn-sm speak-btn" data-list-speak-def="${escapeHtml(c.id)}" aria-label="Speak definition">${svgIcon("speaker", 17)}</button>
                  </div>
                  <div style="display:flex; align-items:center; gap:6px; justify-content:flex-end;">
                    ${(c.mastery || 0) >= 2 ? `<span class="badge badge-green">Mastered</span>` : c.mastery === 1 ? `<span class="badge badge-primary">Learning</span>` : `<span class="badge">New</span>`}
                    <button type="button" class="btn-ghost btn-sm star-btn ${c.starred ? "starred" : ""}" data-list-star="${escapeHtml(c.id)}" aria-label="Star card">${svgIcon("star", 18, c.starred)}</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>
        `;

        container.querySelector("#btnSetBack").onclick = () => { state.view = "home"; render(); };
        container.querySelector("#btnSetEdit").onclick = () => openEditor(set.id);
        container.querySelector("#btnSetScanAdd").onclick = () => openScannerModal(set.id);
        container.querySelectorAll("[data-study-mode]").forEach(b => b.onclick = () => {
          state.study.mode = b.dataset.studyMode;
          if (state.study.mode === "learn") initLearnSession(set);
          if (state.study.mode === "test") initTestSetup(set);
          render();
        });

        const setStarFilter = (val) => {
          if (val && starredCount === 0) return;
          state.study.starredOnly = val;
          initFlashcardsDeck(set);
          initLearnSession(set);
          initTestSetup(set);
          render();
        };
        container.querySelector("#btnFilterAll").onclick = () => setStarFilter(false);
        container.querySelector("#btnFilterStarred").onclick = () => setStarFilter(true);

        container.querySelector("#btnResetSetMastery").onclick = async () => {
          if (await showConfirm("Reset Progress", "Reset mastery levels for all cards in this set back to New?", "Reset", false)) {
            set.cards.forEach(c => { c.mastery = 0; });
            saveSets();
            initLearnSession(set);
            render();
            showToast("Progress reset.");
          }
        };

        container.querySelectorAll("[data-list-speak-term]").forEach(b => b.onclick = () => {
          const c = set.cards.find(x => x.id === b.dataset.listSpeakTerm);
          if (c) speakText(c.term, set.termLang, b);
        });
        container.querySelectorAll("[data-list-speak-def]").forEach(b => b.onclick = () => {
          const c = set.cards.find(x => x.id === b.dataset.listSpeakDef);
          if (c) speakText(c.def, set.defLang, b);
        });
        container.querySelectorAll("[data-list-star]").forEach(b => b.onclick = () => {
          const c = set.cards.find(x => x.id === b.dataset.listStar);
          if (!c) return;
          c.starred = !c.starred;
          saveSets();
          if (state.study.starredOnly && !set.cards.some(x => x.starred)) {
            state.study.starredOnly = false;
            initFlashcardsDeck(set);
          }
          render();
        });

        const stage = container.querySelector("#studyModeStage");
        if (state.study.mode === "flashcards") renderFlashcardsMode(stage, set);
        else if (state.study.mode === "learn") renderLearnMode(stage, set);
        else renderTestMode(stage, set);
      }

      /* ---------------- 7A. FLASHCARDS MODE ---------------- */
      function initFlashcardsDeck(set, customIds = null, shuffled = false) {
        const ids = customIds || getActiveStudyCards(set).map(c => c.id);
        Object.assign(state.study.fc, {
          deckIds: shuffled ? shuffleArray(ids) : ids,
          index: 0, flipped: false, knowIds: [], learningIds: [], finished: false
        });
      }

      function renderFlashcardsMode(stage, set) {
        const fc = state.study.fc;
        if (!fc.deckIds.length) { stage.innerHTML = `<div class="empty-state"><p>No cards available in this filter.</p></div>`; return; }

        if (fc.finished) {
          const total = fc.deckIds.length, knowCount = fc.knowIds.length, learnCount = fc.learningIds.length;
          const pct = total ? Math.round((knowCount / total) * 100) : 0;
          stage.innerHTML = `
            <div class="study-card-box" style="text-align:center;">
              <div class="score-circle" style="border-color:var(--green); color:var(--green); background:var(--green-soft);">${pct}%</div>
              <h2 style="margin:0 0 6px; font-size:1.45rem;">Round Complete!</h2>
              <p style="margin:0 0 18px; color:var(--text-muted);">Great work reviewing ${total} ${total === 1 ? "card" : "cards"}.</p>
              <div style="display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:22px;">
                <span class="badge badge-green" style="font-size:.95rem; padding:8px 16px;">✓ Know: ${knowCount}</span>
                <span class="badge" style="font-size:.95rem; padding:8px 16px; background:var(--orange-soft); color:var(--orange); border-color:transparent;">✕ Still Learning: ${learnCount}</span>
              </div>
              <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                ${learnCount > 0 ? `<button type="button" class="btn btn-primary" id="btnFcStudyLearning">Study Still Learning Cards Only (${learnCount})</button>` : ""}
                <button type="button" class="btn btn-secondary" id="btnFcRestart">Restart Full Deck</button>
              </div>
            </div>
          `;
          stage.querySelector("#btnFcStudyLearning")?.addEventListener("click", () => { initFlashcardsDeck(set, [...fc.learningIds], false); render(); });
          stage.querySelector("#btnFcRestart").onclick = () => { initFlashcardsDeck(set); render(); };
          return;
        }

        const card = set.cards.find(c => c.id === fc.deckIds[fc.index]);
        if (!card) { initFlashcardsDeck(set); return render(); }

        const frontText = fc.swapFrontBack ? card.def : card.term;
        const backText = fc.swapFrontBack ? card.term : card.def;
        const frontLang = fc.swapFrontBack ? set.defLang : set.termLang;
        const backLang = fc.swapFrontBack ? set.termLang : set.defLang;
        const pct = Math.round(((fc.index + 1) / fc.deckIds.length) * 100);

        const faceHtml = (isBack, label, lang, text, speakId, starId, hint) => `
          <div class="flashcard-face ${isBack ? "flashcard-face-back" : ""}">
            <div class="flashcard-face-top">
              <span class="flashcard-side-label">${label} (${escapeHtml(getLangInfo(lang).short)})</span>
              <div class="flashcard-face-tools">
                <button type="button" class="btn-ghost btn-sm speak-btn" id="${speakId}" data-no-flip="1" aria-label="Speak ${label.toLowerCase()}">${svgIcon("speaker", 20)}</button>
                <button type="button" class="btn-ghost btn-sm star-btn ${card.starred ? "starred" : ""}" id="${starId}" data-no-flip="1" aria-label="Star card">${svgIcon("star", 20, card.starred)}</button>
              </div>
            </div>
            <div class="flashcard-content" lang="${escapeHtml(lang)}">${escapeHtml(text)}</div>
            <div class="flashcard-hint">${hint}</div>
          </div>`;

        stage.innerHTML = `
          <div class="flashcard-controls" style="margin-bottom:12px;">
            <div class="progress-wrap">
              <div class="progress-label">
                <span>Card ${fc.index + 1} of ${fc.deckIds.length}</span>
                ${fc.trackProgress ? `<span>✓ ${fc.knowIds.length} Know &nbsp;•&nbsp; ✕ ${fc.learningIds.length} Learning</span>` : `<span>${pct}%</span>`}
              </div>
              <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:var(--primary);"></div></div>
            </div>
          </div>

          <div class="flashcard-stage" id="flashcardStage">
            <div class="flashcard-3d ${fc.flipped ? "is-flipped" : ""}" id="flashcard3d" tabindex="0" role="button" aria-label="Flashcard, tap or press Space to flip">
              ${faceHtml(false, fc.swapFrontBack ? "Definition" : "Term", frontLang, frontText, "fcSpeakFront", "fcStarFront", "Tap card or press Space to flip • Swipe left/right on mobile")}
              ${faceHtml(true, fc.swapFrontBack ? "Term" : "Definition", backLang, backText, "fcSpeakBack", "fcStarBack", "Shortcuts: Space flip • ←/→ rate • S star • A audio")}
            </div>
          </div>

          <div class="flashcard-controls">
            <div class="fc-nav-row">
              ${fc.trackProgress ? `
                <button type="button" class="btn-still-learning" id="btnFcLearning">✕ Still Learning</button>
                <button type="button" class="btn-know" id="btnFcKnow">✓ Know</button>
              ` : `
                <button type="button" class="btn btn-secondary" id="btnFcPrev" ${fc.index === 0 ? "disabled" : ""} style="flex:1; max-width:200px;">← Previous</button>
                <button type="button" class="btn btn-primary" id="btnFcNext" style="flex:1; max-width:200px;">Next →</button>
              `}
            </div>
            <div class="fc-meta-row panel" style="padding:10px 14px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" class="btn btn-secondary btn-sm" id="btnFcShuffle">🔀 Shuffle</button>
                <button type="button" class="btn btn-secondary btn-sm" id="btnFcSwap">${fc.swapFrontBack ? "Front: Definition → Recall Term" : "Front: Term → Recall Def"}</button>
                <button type="button" class="btn btn-secondary btn-sm" id="btnFcResetDeck">↺ Reset</button>
              </div>
              <div style="display:flex; gap:14px; flex-wrap:wrap;">
                <label class="switch-label" style="min-height:36px; font-size:.84rem;">
                  <input type="checkbox" class="switch-input" id="chkFcTrack" ${fc.trackProgress ? "checked" : ""} />
                  <span class="switch"></span><span>Track Progress</span>
                </label>
                <label class="switch-label" style="min-height:36px; font-size:.84rem;">
                  <input type="checkbox" class="switch-input" id="chkFcAutoAudio" ${fc.autoPlayAudio ? "checked" : ""} />
                  <span class="switch"></span><span>Auto-Play Audio</span>
                </label>
              </div>
            </div>
          </div>
        `;

        const cardEl = stage.querySelector("#flashcard3d");
        const advanceCard = (status = null) => {
          if (fc.trackProgress && status) {
            const add = status === "know" ? fc.knowIds : fc.learningIds;
            const remKey = status === "know" ? "learningIds" : "knowIds";
            if (!add.includes(card.id)) add.push(card.id);
            fc[remKey] = fc[remKey].filter(id => id !== card.id);
          }
          if (fc.index + 1 >= fc.deckIds.length) fc.finished = true;
          else { fc.index++; fc.flipped = false; }
          render();
          if (!fc.finished && fc.autoPlayAudio) {
            const nextCard = set.cards.find(c => c.id === fc.deckIds[fc.index]);
            if (nextCard) speakText(fc.swapFrontBack ? nextCard.def : nextCard.term, fc.swapFrontBack ? set.defLang : set.termLang);
          }
        };

        cardEl.onclick = (e) => {
          if (e.target.closest("[data-no-flip]")) return;
          fc.flipped = !fc.flipped;
          cardEl.classList.toggle("is-flipped", fc.flipped);
          if (fc.autoPlayAudio) speakText(fc.flipped ? backText : frontText, fc.flipped ? backLang : frontLang);
        };

        let tx = 0, ty = 0;
        cardEl.addEventListener("touchstart", (e) => {
          if (!e.target.closest("[data-no-flip]")) { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }
        }, { passive: true });
        cardEl.addEventListener("touchend", (e) => {
          if (e.target.closest("[data-no-flip]")) return;
          const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
          if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.25) {
            if (dx > 0) { fc.trackProgress ? advanceCard("know") : fc.index > 0 && (fc.index--, fc.flipped = false, render()); }
            else advanceCard(fc.trackProgress ? "learning" : null);
          }
        }, { passive: true });

        stage.querySelector("#fcSpeakFront").onclick = (e) => { e.stopPropagation(); speakText(frontText, frontLang, e.currentTarget); };
        stage.querySelector("#fcSpeakBack").onclick = (e) => { e.stopPropagation(); speakText(backText, backLang, e.currentTarget); };
        const toggleStar = (e) => { e.stopPropagation(); card.starred = !card.starred; saveSets(); render(); };
        stage.querySelector("#fcStarFront").onclick = toggleStar;
        stage.querySelector("#fcStarBack").onclick = toggleStar;

        if (fc.trackProgress) {
          stage.querySelector("#btnFcLearning").onclick = () => advanceCard("learning");
          stage.querySelector("#btnFcKnow").onclick = () => advanceCard("know");
        } else {
          stage.querySelector("#btnFcPrev").onclick = () => { if (fc.index > 0) { fc.index--; fc.flipped = false; render(); } };
          stage.querySelector("#btnFcNext").onclick = () => advanceCard(null);
        }

        stage.querySelector("#btnFcShuffle").onclick = () => { initFlashcardsDeck(set, null, true); render(); showToast("Deck shuffled!"); };
        stage.querySelector("#btnFcSwap").onclick = () => { fc.swapFrontBack = !fc.swapFrontBack; fc.flipped = false; render(); };
        stage.querySelector("#btnFcResetDeck").onclick = () => { initFlashcardsDeck(set); render(); };
        stage.querySelector("#chkFcTrack").onchange = (e) => { fc.trackProgress = e.target.checked; render(); };
        stage.querySelector("#chkFcAutoAudio").onchange = (e) => { fc.autoPlayAudio = e.target.checked; };
      }

      /* ---------------- 7B. LEARN MODE ---------------- */
      function initLearnSession(set) {
        const active = getActiveStudyCards(set);
        const unmastered = active.filter(c => (c.mastery || 0) < 2);
        const roundIds = shuffleArray(unmastered.length ? unmastered : active).slice(0, 7).map(c => c.id);
        Object.assign(state.study.learn, {
          roundIds, queueIds: [...roundIds], currentCardId: null, questionType: "mc", mcOptions: [],
          selectedOption: null, writtenInput: "", checkingAi: false, aiError: null, feedback: null,
          roundCorrect: 0, roundAttempts: 0, roundComplete: false
        });
        prepareNextLearnQuestion(set);
      }

      function prepareNextLearnQuestion(set) {
        const ln = state.study.learn;
        if (!ln.queueIds.length) { ln.roundComplete = true; ln.currentCardId = null; return; }
        const card = set.cards.find(c => c.id === ln.queueIds[0]);
        if (!card) { ln.queueIds.shift(); return prepareNextLearnQuestion(set); }

        Object.assign(ln, {
          currentCardId: card.id, selectedOption: null, writtenInput: "", checkingAi: false, aiError: null, feedback: null,
          questionType: (card.mastery || 0) === 0 ? "mc" : "written"
        });
        if (ln.questionType === "mc") {
          const askDef = ln.promptSide === "term";
          ln.mcOptions = buildMcOptions(set.cards, card.id, askDef, askDef ? card.def : card.term);
        }
      }

      function renderLearnMode(stage, set) {
        const ln = state.study.learn, active = getActiveStudyCards(set);
        if (!active.length) { stage.innerHTML = `<div class="empty-state"><p>No cards available in this filter.</p></div>`; return; }

        if (ln.roundComplete) {
          const acc = ln.roundAttempts ? Math.round((ln.roundCorrect / ln.roundAttempts) * 100) : 100;
          const remaining = active.filter(c => (c.mastery || 0) < 2).length;
          stage.innerHTML = `
            <div class="study-card-box" style="text-align:center;">
              <div class="score-circle" style="border-color:var(--green); color:var(--green); background:var(--green-soft);">${acc}%</div>
              <h2 style="margin:0 0 8px;">Round Mastered!</h2>
              <p style="margin:0 0 18px; color:var(--text-muted);">${remaining > 0 ? `${remaining} more ${remaining === 1 ? "card" : "cards"} left to master in this set.` : "You have mastered every card in this set!"}</p>
              <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                ${remaining > 0 ? `<button type="button" class="btn btn-primary" id="btnLearnContinue">Continue Next Round (${remaining} left)</button>` : ""}
                <button type="button" class="btn btn-secondary" id="btnLearnRestart">Practice Another Round</button>
              </div>
            </div>
          `;
          stage.querySelector("#btnLearnContinue")?.addEventListener("click", () => { initLearnSession(set); render(); });
          stage.querySelector("#btnLearnRestart").onclick = () => {
            if (remaining === 0) { active.forEach(c => { c.mastery = 0; }); saveSets(); }
            initLearnSession(set); render();
          };
          return;
        }

        const card = set.cards.find(c => c.id === ln.currentCardId);
        if (!card) { initLearnSession(set); return render(); }

        const askDef = ln.promptSide === "term";
        const promptText = askDef ? card.term : card.def, answerText = askDef ? card.def : card.term;
        const promptLang = askDef ? set.termLang : set.defLang, answerLang = askDef ? set.defLang : set.termLang;
        const masteredInRound = ln.roundIds.filter(id => !ln.queueIds.includes(id)).length;
        const pct = Math.round((masteredInRound / ln.roundIds.length) * 100);
        const hasAiKey = Boolean((state.prefs.apiKey || "").trim());

        stage.innerHTML = `
          <div class="study-card-box">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span class="badge badge-primary">${ln.questionType === "mc" ? "Stage 1: Multiple Choice" : "Stage 2: Written"}</span>
                <span class="badge">${masteredInRound}/${ln.roundIds.length} Mastered in Round</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                ${ln.questionType === "written" ? `
                  <button type="button" class="btn btn-sm ${state.prefs.aiGrading && hasAiKey ? "btn-outline-primary" : "btn-secondary"}" id="btnToggleAiGrade" title="Use Gemini AI to judge synonyms and phrasing">
                    ✨ AI Check: ${state.prefs.aiGrading && hasAiKey ? "ON" : hasAiKey ? "OFF" : "No Key"}
                  </button>` : ""}
                <button type="button" class="btn btn-secondary btn-sm" id="btnLearnSwapSide">${askDef ? "Ask: Term → Answer: Definition" : "Ask: Definition → Answer: Term"}</button>
              </div>
            </div>
            <div class="progress-track" style="margin-bottom:20px;"><div class="progress-fill" style="width:${pct}%;"></div></div>

            <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
              <div>
                <div class="field-caption" style="margin-bottom:6px;">${askDef ? "TERM" : "DEFINITION"} (${escapeHtml(getLangInfo(promptLang).short)})</div>
                <div style="font-size:1.45rem; font-weight:700; line-height:1.35;" lang="${escapeHtml(promptLang)}">${escapeHtml(promptText)}</div>
              </div>
              <button type="button" class="btn-icon speak-btn" id="btnLearnSpeak" aria-label="Listen to prompt">${svgIcon("speaker", 20)}</button>
            </div>

            ${ln.questionType === "mc" ? `
              <div class="mc-options-grid">
                ${ln.mcOptions.map((opt, idx) => {
                  let cls = "mc-option";
                  if (ln.feedback) {
                    if (normalizeAnswer(opt) === normalizeAnswer(answerText)) cls += " correct";
                    else if (ln.selectedOption === idx) cls += " incorrect";
                  }
                  return `<button type="button" class="${cls}" data-mc-opt="${idx}" ${ln.feedback ? "disabled" : ""} lang="${escapeHtml(answerLang)}"><span class="mc-num">${idx + 1}</span><span>${escapeHtml(opt)}</span></button>`;
                }).join("")}
              </div>
            ` : `
              <form id="learnWrittenForm" style="margin-top:20px; display:flex; flex-direction:column; gap:12px;">
                <label class="form-label" for="learnWrittenInput">Type the ${askDef ? "definition" : "word / term"} (${escapeHtml(getLangInfo(answerLang).short)})</label>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <input id="learnWrittenInput" class="input" type="text" lang="${escapeHtml(answerLang)}" value="${escapeHtml(ln.writtenInput)}" placeholder="Type your answer..." ${ln.feedback || ln.checkingAi ? "disabled" : ""} autocomplete="off" style="flex:1; min-width:200px;" />
                  ${!ln.feedback ? `<button type="submit" class="btn btn-primary" ${ln.checkingAi ? "disabled" : ""}>${ln.checkingAi ? `<span class="spinner"></span> ✨ Checking...` : `Check Answer`}</button>` : ""}
                </div>
              </form>
            `}

            ${ln.aiError && !ln.feedback && !ln.checkingAi ? `
              <div class="feedback-banner incorrect">
                <div>
                  <div>⚠️ AI Check failed: ${escapeHtml(ln.aiError.message)}</div>
                  <div class="feedback-sub">Your progress wasn't penalized. Click Recall AI to try again, or grade locally.</div>
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <button type="button" class="btn btn-primary btn-sm" id="btnLearnRecallAi">↻ Recall AI</button>
                  <button type="button" class="btn btn-secondary btn-sm" id="btnLearnFallbackLocal">Grade Locally</button>
                </div>
              </div>
            ` : ""}

            ${ln.feedback ? `
              <div class="feedback-banner ${ln.feedback.correct ? "correct" : "incorrect"}">
                <div>
                  <div>${ln.feedback.correct
                    ? `✓ Correct${ln.feedback.aiVerified ? " (✨ AI verified)" : ""}! ${(card.mastery || 0) >= 2 ? "Card mastered!" : "One more stage to master."}`
                    : `✕ Not quite. Reference answer: <strong lang="${escapeHtml(answerLang)}">${escapeHtml(ln.feedback.rightAnswer)}</strong>`}</div>
                  ${ln.feedback.aiNote ? `<div class="feedback-sub">✨ ${escapeHtml(ln.feedback.aiNote)}</div>` : ""}
                </div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  ${!ln.feedback.correct ? `<button type="button" class="btn btn-secondary btn-sm" id="btnLearnOverride">Override: I was right</button>` : ""}
                  <button type="button" class="btn btn-primary btn-sm" id="btnLearnNext">Continue →</button>
                </div>
              </div>
            ` : ""}
          </div>
        `;

        stage.querySelector("#btnLearnSpeak").onclick = (e) => speakText(promptText, promptLang, e.currentTarget);
        stage.querySelector("#btnToggleAiGrade")?.addEventListener("click", () => {
          if (!hasAiKey) return openSettingsModal();
          state.prefs.aiGrading = !state.prefs.aiGrading;
          savePrefs(); render();
          showToast(state.prefs.aiGrading ? "✨ AI Smart Grading enabled" : "AI Smart Grading disabled (local matching only)");
        });
        stage.querySelector("#btnLearnSwapSide").onclick = () => {
          ln.promptSide = askDef ? "def" : "term";
          prepareNextLearnQuestion(set); render();
        };

        const finalizeLearn = (isCorrect, userAnswer, aiVerified = false, aiNote = "") => {
          ln.roundAttempts++;
          if (isCorrect) { ln.roundCorrect++; card.mastery = Math.min(2, (card.mastery || 0) + 1); }
          else card.mastery = Math.max(0, (card.mastery || 0) - 1);
          saveSets();
          ln.checkingAi = false;
          ln.aiError = null;
          ln.feedback = { correct: isCorrect, rightAnswer: answerText, userAnswer, aiVerified, aiNote };
          render();
        };

        const submitWrittenForAi = async (val) => {
          if (isLocallyAcceptable(val, answerText)) return finalizeLearn(true, val);
          if (state.prefs.aiGrading && hasAiKey) {
            ln.checkingAi = true;
            ln.aiError = null;
            render();
            try {
              const aiRes = await gradeWrittenWithAi({ promptText, promptLang, answerText, answerLang, userAnswer: val });
              finalizeLearn(aiRes.correct, val, aiRes.correct, aiRes.feedback);
            } catch (err) {
              ln.checkingAi = false;
              ln.aiError = { message: err.message === "MISSING_KEY" ? "Add your Gemini API key in Settings." : err.message, pendingValue: val };
              render();
            }
          } else {
            finalizeLearn(false, val);
          }
        };

        if (ln.questionType === "mc" && !ln.feedback) {
          stage.querySelectorAll("[data-mc-opt]").forEach(btn => btn.onclick = () => {
            ln.selectedOption = Number(btn.dataset.mcOpt);
            const chosen = ln.mcOptions[ln.selectedOption];
            finalizeLearn(isLocallyAcceptable(chosen, answerText), chosen);
          });
        }

        if (ln.questionType === "written" && !ln.feedback && !ln.checkingAi) {
          const inp = stage.querySelector("#learnWrittenInput");
          if (!ln.aiError) inp.focus();
          inp.oninput = (e) => { ln.writtenInput = e.target.value; };
          stage.querySelector("#learnWrittenForm").onsubmit = async (e) => {
            e.preventDefault();
            const val = inp.value.trim();
            if (!val) return;
            ln.writtenInput = val;
            await submitWrittenForAi(val);
          };

          if (ln.aiError) {
            stage.querySelector("#btnLearnRecallAi")?.addEventListener("click", () => {
              const val = inp.value.trim() || ln.aiError.pendingValue;
              if (val) submitWrittenForAi(val);
            });
            stage.querySelector("#btnLearnFallbackLocal")?.addEventListener("click", () => {
              const val = inp.value.trim() || ln.aiError.pendingValue;
              finalizeLearn(isLocallyAcceptable(val, answerText), val);
            });
          }
        }

        if (ln.feedback) {
          const advanceQueue = () => {
            const cur = ln.queueIds.shift();
            if ((card.mastery || 0) < 2) ln.queueIds.push(cur);
            prepareNextLearnQuestion(set); render();
          };
          const nextBtn = stage.querySelector("#btnLearnNext");
          nextBtn.onclick = advanceQueue;
          nextBtn.focus();
          stage.querySelector("#btnLearnOverride")?.addEventListener("click", () => {
            if (!ln.feedback.correct) {
              ln.roundCorrect++;
              card.mastery = Math.min(2, (card.mastery || 0) + 2);
              saveSets(); advanceQueue(); showToast("Marked as correct!");
            }
          });
        }
      }

      /* ---------------- 7C. TEST MODE ---------------- */
      function initTestSetup(set) {
        const active = getActiveStudyCards(set);
        state.study.test = {
          phase: "setup", gradingAi: false,
          config: { count: Math.min(10, Math.max(1, active.length)), direction: "term", types: { mc: true, written: true, tf: true } },
          questions: [], userAnswers: {}, results: null
        };
      }

      function generateTestQuestions(set, cardsPool, config) {
        const chosen = shuffleArray(cardsPool).slice(0, Math.min(config.count, cardsPool.length));
        const enabledTypes = Object.entries(config.types).filter(([, on]) => on).map(([k]) => k);
        if (!enabledTypes.length) enabledTypes.push("mc");

        return chosen.map((card, i) => {
          const type = enabledTypes[i % enabledTypes.length];
          const askDef = config.direction === "both" ? i % 2 === 0 : config.direction === "def";
          const prompt = askDef ? card.term : card.def, answer = askDef ? card.def : card.term;
          const promptLang = askDef ? set.termLang : set.defLang, answerLang = askDef ? set.defLang : set.termLang;

          if (type === "tf") {
            const others = set.cards.filter(c => c.id !== card.id);
            const showTrue = !others.length || Math.random() < 0.5;
            const other = others[Math.floor(Math.random() * others.length)];
            const shownMatch = showTrue ? answer : (askDef ? other.def : other.term);
            return { id: uid(), cardId: card.id, type, prompt, shownMatch, correctAnswer: normalizeAnswer(shownMatch) === normalizeAnswer(answer) ? "True" : "False", promptLang, answerLang };
          }
          if (type === "mc") {
            return { id: uid(), cardId: card.id, type, prompt, options: buildMcOptions(set.cards, card.id, askDef, answer), correctAnswer: answer, promptLang, answerLang };
          }
          return { id: uid(), cardId: card.id, type: "written", prompt, correctAnswer: answer, promptLang, answerLang };
        });
      }

      function renderTestMode(stage, set) {
        const t = state.study.test, active = getActiveStudyCards(set);
        if (!active.length) { stage.innerHTML = `<div class="empty-state"><p>No cards available in this filter.</p></div>`; return; }

        if (t.phase === "setup") {
          const maxQ = active.length;
          t.config.count = Math.min(t.config.count, maxQ);
          stage.innerHTML = `
            <div class="study-card-box">
              <h2 style="margin:0 0 6px; font-size:1.35rem;">Configure Practice Test</h2>
              <p style="margin:0 0 18px; color:var(--text-muted);">Customize your quiz before starting. Answers are graded when you submit.</p>
              <div class="form-grid" style="margin-bottom:18px;">
                <div class="form-group">
                  <label class="form-label" for="testCountInput">Questions (Max ${maxQ})</label>
                  <input id="testCountInput" class="input" type="number" min="1" max="${maxQ}" value="${t.config.count}" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="testDirection">Question &amp; Answer Direction</label>
                  <select id="testDirection" class="select">
                    <option value="term" ${t.config.direction === "term" ? "selected" : ""}>Show Definition → Answer with Term (${escapeHtml(getLangInfo(set.termLang).short)})</option>
                    <option value="def" ${t.config.direction === "def" ? "selected" : ""}>Show Term → Answer with Definition (${escapeHtml(getLangInfo(set.defLang).short)})</option>
                    <option value="both" ${t.config.direction === "both" ? "selected" : ""}>Both (Mixed)</option>
                  </select>
                </div>
              </div>
              <div class="form-group" style="margin-bottom:20px;">
                <span class="form-label">Question Types</span>
                <div style="display:flex; gap:18px; flex-wrap:wrap; margin-top:4px;">
                  ${[["chkTestMc", "mc", "Multiple Choice"], ["chkTestWritten", "written", "Written"], ["chkTestTf", "tf", "True / False"]].map(([id, key, label]) => `
                    <label class="switch-label"><input type="checkbox" class="switch-input" id="${id}" ${t.config.types[key] ? "checked" : ""} /><span class="switch"></span><span>${label}</span></label>
                  `).join("")}
                </div>
              </div>
              <button type="button" class="btn btn-primary" id="btnStartTest" style="width:100%;">Start Practice Test</button>
            </div>
          `;
          stage.querySelector("#testCountInput").oninput = (e) => { t.config.count = Math.max(1, Math.min(maxQ, Number(e.target.value) || 1)); };
          stage.querySelector("#testDirection").onchange = (e) => { t.config.direction = e.target.value; };
          stage.querySelector("#chkTestMc").onchange = (e) => { t.config.types.mc = e.target.checked; };
          stage.querySelector("#chkTestWritten").onchange = (e) => { t.config.types.written = e.target.checked; };
          stage.querySelector("#chkTestTf").onchange = (e) => { t.config.types.tf = e.target.checked; };
          stage.querySelector("#btnStartTest").onclick = () => {
            if (!t.config.types.mc && !t.config.types.written && !t.config.types.tf) return showToast("Select at least one question type.", "error");
            t.questions = generateTestQuestions(set, active, t.config);
            t.userAnswers = {}; t.phase = "exam"; render();
          };
          return;
        }

        if (t.phase === "exam") {
          stage.innerHTML = `
            <form id="testExamForm" style="max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:16px;">
              ${t.questions.map((q, idx) => `
                <div class="study-card-box" style="margin:0;">
                  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span class="badge badge-primary">Question ${idx + 1} of ${t.questions.length} • ${q.type === "mc" ? "Multiple Choice" : q.type === "tf" ? "True / False" : "Written"}</span>
                    <button type="button" class="btn-ghost btn-sm speak-btn" data-test-speak="${idx}" aria-label="Listen">${svgIcon("speaker", 18)}</button>
                  </div>
                  ${q.type === "tf" ? `
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:10px; background:var(--surface-secondary); border-radius:var(--radius-md); margin-bottom:14px;">
                      <div><div class="field-caption">PROMPT</div><div style="font-weight:700; font-size:1.1rem;" lang="${escapeHtml(q.promptLang)}">${escapeHtml(q.prompt)}</div></div>
                      <div><div class="field-caption">MATCHING ANSWER</div><div style="font-weight:700; font-size:1.1rem;" lang="${escapeHtml(q.answerLang)}">${escapeHtml(q.shownMatch)}</div></div>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                      ${["True", "False"].map(v => `<button type="button" class="mc-option ${t.userAnswers[q.id] === v ? "selected" : ""}" data-tf-ans="${q.id}" data-val="${v}" ${t.gradingAi ? "disabled" : ""}>${v}</button>`).join("")}
                    </div>
                  ` : q.type === "mc" ? `
                    <div style="font-size:1.25rem; font-weight:700; margin-bottom:14px;" lang="${escapeHtml(q.promptLang)}">${escapeHtml(q.prompt)}</div>
                    <div class="mc-options-grid">
                      ${q.options.map((opt, oIdx) => `

            let aiGradingError = "";
            const needAi = graded.filter(it => it.type === "written" && !it.isCorrect && it.userAnswer.length > 0);

          ${res.aiGradingError ? `
            <div class="feedback-banner incorrect" style="max-width:760px; margin:0 auto 18px;">

                <div>⚠️ AI grading failed: ${escapeHtml(res.aiGradingError)}</div>
                <div class="feedback-sub">Written answers were checked locally only. Recall AI to grade synonyms &amp; phrasing.</div>
              </div>
              <button type="button" class="btn btn-primary btn-sm" id="btnTestRecallAi" ${t.gradingAi ? "disabled" : ""}>
                ${t.gradingAi ? `<span class="spinner"></span> ↻ Recalling AI...` : `↻ Recall AI Grading`}
              </button>
            </div>
          ` : ""}

          <div style="max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:12px;">
            ${res.items.map((item, idx) => `
              <div class="study-card-box" style="margin:0; border-left:5px solid ${item.isCorrect ? "var(--green)" : "var(--orange)"};">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <span style="font-weight:800; font-size:.86rem; color:${item.isCorrect ? "var(--green)" : "var(--orange)"};">
                    ${item.isCorrect ? (item.aiVerified ? "✓ Correct (✨ AI verified)" : "✓ Correct") : "✕ Incorrect"} — Q${idx + 1}
                  </span>
                  <button type="button" class="btn-ghost btn-sm speak-btn" data-res-speak="${idx}" aria-label="Speak prompt">${svgIcon("speaker", 17)}</button>
                </div>
                <div style="font-weight:700; font-size:1.1rem; margin-bottom:8px;" lang="${escapeHtml(item.promptLang)}">
                  ${escapeHtml(item.prompt)} ${item.type === "tf" ? `= "${escapeHtml(item.shownMatch)}"` : ""}
                </div>
                <div style="display:flex; flex-direction:column; gap:4px; font-size:.94rem;">
                  <div><span style="color:var(--text-muted);">Your answer:</span> <strong style="color:${item.isCorrect ? "var(--green)" : "var(--orange)"};">${escapeHtml(item.userAnswer || "(No answer)")}</strong></div>
                  ${(!item.isCorrect || item.aiVerified) ? `<div><span style="color:var(--text-muted);">Reference answer:</span> <strong style="color:var(--green);" lang="${escapeHtml(item.answerLang)}">${escapeHtml(item.correctAnswer)}</strong></div>` : ""}
                  ${item.aiNote ? `<div style="font-size:.84rem; color:var(--text-muted);">✨ ${escapeHtml(item.aiNote)}</div>` : ""}
                </div>
              </div>
            `).join("")}
          </div>
        `;

        stage.querySelector("#btnTestRecallAi")?.addEventListener("click", async () => {
          const needAi = res.items.filter(it => it.type === "written" && !it.isCorrect && it.userAnswer.length > 0);
          if (!needAi.length) { res.aiGradingError = ""; return render(); }
          t.gradingAi = true; render();
          try {
            const aiMap = await batchGradeWrittenTestWithAi(needAi);
            for (const it of res.items) {
              if (aiMap[it.id]) {
                it.isCorrect = aiMap[it.id].correct;
                it.aiVerified = aiMap[it.id].correct;
                it.aiNote = aiMap[it.id].feedback;
              }
            }
            res.correctCount = res.items.filter(i => i.isCorrect).length;
            res.pct = Math.round((res.correctCount / res.items.length) * 100);
            res.aiGradingError = "";

          } catch (err) {
            res.aiGradingError = err.message === "MISSING_KEY" ? "Missing Gemini API key." : (err.message || "AI grading failed.");

          } finally {
            t.gradingAi = false;
            render();
          }

        stage.querySelectorAll("[data-res-speak]").forEach(b => b.onclick = () => {

      /* =====================================================================
         8. AI CAMERA & PHOTO-TO-FLASHCARD SCANNER
      ===================================================================== */
      function stopCameraStream() {
        state.scanner.stream?.getTracks().forEach(tr => { try { tr.stop(); } catch {} });
        state.scanner.stream = null;
        const v = $("scannerVideoEl");
        if (v) v.srcObject = null;
      }

      function openScannerModal(targetSetId = null) {
        let termLang = "en-US", defLang = "zh-TW";
        if (targetSetId === "EDITOR") ({ termLang, defLang } = state.editor);
        else if (targetSetId) { const s = getSetById(targetSetId); if (s) ({ termLang, defLang } = s); }

        Object.assign(state.scanner, {
          open: true, step: "capture", facingMode: "environment", stream: null, cameraError: "",
          imageDataUrl: "", mode: "auto", termLang, defLang, extracting: false, extractError: "", extractedCards: [], targetSetId
        });
        $("scannerModal").classList.remove("hidden");
        renderScannerModal();
        startCameraViewfinder();
      }

      function closeScannerModal() {
        stopCameraStream();
        state.scanner.open = false;
        $("scannerModal").classList.add("hidden");
      }

      async function startCameraViewfinder() {
        stopCameraStream();
        const sc = state.scanner;
        sc.cameraError = "";
        if (!navigator.mediaDevices?.getUserMedia) {
          sc.cameraError = "Live camera is unavailable in this browser context (HTTPS is required on mobile). Use Upload from Gallery below.";
          return renderScannerModal();
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: sc.facingMode }, width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
          });
          if (!sc.open || sc.step !== "capture") return stream.getTracks().forEach(t => t.stop());
          sc.stream = stream;
          const v = $("scannerVideoEl");
          if (v) { v.srcObject = stream; await v.play().catch(() => {}); }
          $("scannerCameraFallback")?.classList.add("hidden");
        } catch (err) {
          sc.cameraError = err.name === "NotAllowedError"
            ? "Camera permission denied. You can allow camera access or upload a photo from your gallery."
            : "Could not start camera (" + (err.message || "unavailable") + "). Please upload a photo from your gallery.";
          renderScannerModal();
        }
      }

      function compressCanvasToJpeg(src, maxSide = 1600, quality = 0.85) {
        const w = src.videoWidth || src.naturalWidth || src.width;
        const h = src.videoHeight || src.naturalHeight || src.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(w * scale));
        canvas.height = Math.max(1, Math.round(h * scale));
        canvas.getContext("2d").drawImage(src, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", quality);
      }

      function handleUploadedImageFile(file) {
        if (!file || !file.type.startsWith("image/")) return showToast("Please select a valid image file.", "error");
        stopCameraStream();
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            state.scanner.imageDataUrl = compressCanvasToJpeg(img);
            state.scanner.step = "preview";
            state.scanner.extractError = "";
            renderScannerModal();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      }

      async function runAiPhotoExtraction() {
        const sc = state.scanner;
        if (!sc.imageDataUrl) return;
        sc.extracting = true; sc.extractError = ""; renderScannerModal();

        const modeInstr = sc.mode === "auto"
          ? "Mode: Auto / Smart Detect. Inspect the image (printed vocab list, flashcards, handwritten notes, or dense text). Extract clear vocabulary pairs or key concepts into flashcards."
          : sc.mode === "qa"
          ? "Mode: Textbook Paragraph -> Q&A Cards. Summarize key concepts, formulas, definitions, or important facts from the text into crisp Term (question or concept) and Definition (concise answer or explanation) flashcards."
          : "Mode: Real-World Object / Scene -> Vocabulary. Identify prominent objects, actions, or items visible in the photo and create helpful vocabulary flashcards.";

        const prompt = `${modeInstr}
Target Term Language: ${getLangInfo(sc.termLang).label}
Target Definition Language: ${getLangInfo(sc.defLang).label}

Return strictly valid JSON with this exact schema:
{
  "suggestedTitle": "Short descriptive title for this study set",
  "cards": [
    { "term": "...", "def": "..." }
  ]
}
Keep terms and definitions accurate, clean, and concise for flashcard study. Extract up to 25 of the best cards.`;

        try {
          const res = await callGemini({
            parts: [{ text: prompt }, { inlineData: { mimeType: "image/jpeg", data: sc.imageDataUrl.split(",")[1] } }],
            expectJson: true
          });
          if (!sc.open || sc.step !== "preview") return;
          const cards = (Array.isArray(res.cards) ? res.cards : [])
            .map(c => ({ id: uid(), checked: true, term: String(c.term || "").trim(), def: String(c.def || "").trim() }))
            .filter(c => c.term || c.def);
          if (!cards.length) throw new Error("No flashcards could be extracted from this image. Try a clearer photo or different mode.");
          sc.extractedCards = cards;
          sc.suggestedTitle = String(res.suggestedTitle || "Scanned Study Set").trim();
          sc.step = "results";
        } catch (err) {
          if (!sc.open) return;
          sc.extractError = err.message === "MISSING_KEY" ? "Please enter your Gemini API key in Settings (⚙️) first." : err.message;
        } finally {
          sc.extracting = false;
          if (sc.open) renderScannerModal();
        }
      }

      function renderScannerModal() {
        const body = $("scannerModalBody"), sc = state.scanner;
        if (!sc.open) return;

        if (sc.step === "capture") {
          body.innerHTML = `
            <div class="camera-box">
              <video id="scannerVideoEl" class="camera-video" autoplay playsinline muted></video>
              <div class="camera-overlay-top">

                <p style="margin:0; max-width:380px; font-size:.94rem;">${escapeHtml(sc.cameraError)}</p>

          body.querySelector("#btnSwitchCam").onclick = () => { sc.facingMode = sc.facingMode === "environment" ? "user" : "environment"; startCameraViewfinder(); };

          dz.ondragover = (e) => { e.preventDefault(); dz.classList.add("dragover"); };
          dz.ondragleave = () => dz.classList.remove("dragover");
          dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove("dragover"); e.dataTransfer.files?.[0] && handleUploadedImageFile(e.dataTransfer.files[0]); };
          return;
        }

        if (sc.step === "preview") {
          body.innerHTML = `
            <img src="${sc.imageDataUrl}" alt="Captured study material" class="captured-preview-img" />
            <div class="form-group">
              <span class="form-label">AI Extraction Mode</span>
