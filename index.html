            <button type="button" class="btn btn-secondary" id="btnScanBackPreview">← Back</button>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              ${(sc.targetSetId || state.sets.length > 0) ? `<button type="button" class="btn btn-outline-primary" id="btnScanAddCurrent" ${selectedCount === 0 ? "disabled" : ""}>Add to ${sc.targetSetId === "EDITOR" ? "Current Editor" : sc.targetSetId ? "Current Set" : "Selected Set"}</button>` : ""}
              <button type="button" class="btn btn-primary" id="btnScanCreateNew" ${selectedCount === 0 ? "disabled" : ""}>Create New Set (${selectedCount})</button>
            </div>
          </div>
        `;

        body.querySelector("#scanSetTitle").oninput = (e) => { sc.suggestedTitle = e.target.value; };
        body.querySelectorAll("[data-scan-chk]").forEach(chk => chk.onchange = () => { sc.extractedCards[Number(chk.dataset.scanChk)].checked = chk.checked; renderScannerModal(); });
        body.querySelectorAll("[data-scan-term]").forEach(inp => inp.oninput = () => { sc.extractedCards[Number(inp.dataset.scanTerm)].term = inp.value; });
        body.querySelectorAll("[data-scan-def]").forEach(inp => inp.oninput = () => { sc.extractedCards[Number(inp.dataset.scanDef)].def = inp.value; });
        body.querySelector("#btnScanSwapAll").onclick = () => {
          sc.extractedCards.forEach(c => { [c.term, c.def] = [c.def, c.term]; });
          [sc.termLang, sc.defLang] = [sc.defLang, sc.termLang];
          renderScannerModal();
        };
        body.querySelector("#btnScanToggleAll").onclick = () => {
          const allOn = selectedCount === sc.extractedCards.length;
          sc.extractedCards.forEach(c => { c.checked = !allOn; });
          renderScannerModal();
        };
        body.querySelector("#btnScanBackPreview").onclick = () => { sc.step = "preview"; renderScannerModal(); };

        const getSelectedCards = () => sc.extractedCards
          .filter(c => c.checked && (c.term.trim() || c.def.trim()))
          .map(c => makeCard(c.term.trim(), c.def.trim()));

        body.querySelector("#btnScanCreateNew").onclick = () => {
          const cards = getSelectedCards();
          if (!cards.length) return;
          const newSet = {
            id: uid(), title: (sc.suggestedTitle || "Scanned Study Set").trim(),
            description: "Created from AI Photo Scan", folder: "AI Scanned",
            termLang: sc.termLang, defLang: sc.defLang, createdAt: Date.now(), updatedAt: Date.now(), cards
          };
          state.sets.unshift(newSet);
          saveSets(); closeScannerModal();
          showToast(`Created "${newSet.title}" with ${cards.length} cards!`, "success");
          openSetView(newSet.id);
        };

        body.querySelector("#btnScanAddCurrent")?.addEventListener("click", () => {
          const cards = getSelectedCards();
          if (!cards.length) return;
          if (sc.targetSetId === "EDITOR") {
            while (state.editor.cards.length && !state.editor.cards.at(-1).term.trim() && !state.editor.cards.at(-1).def.trim()) state.editor.cards.pop();
            state.editor.cards.push(...cards);
            closeScannerModal(); render();
            return showToast(`Added ${cards.length} cards to editor!`, "success");
          }
          const target = sc.targetSetId ? getSetById(sc.targetSetId) : state.sets[0];
          if (target) {
            target.cards.push(...cards); target.updatedAt = Date.now();
            saveSets(); closeScannerModal();
            showToast(`Added ${cards.length} cards to "${target.title}"!`, "success");
            openSetView(target.id);
          }
        });
      }

      /* =====================================================================
         9. SETTINGS & BACKUP MODALS
      ===================================================================== */
      function openSettingsModal() {
        const modal = $("settingsModal"), body = $("settingsModalBody");
        let showKey = false;
        loadVoices();

        const renderBody = () => {
          const zhVoices = cachedVoices.filter(v => /^(zh|cmn)/.test(normalizeVoiceLang(v.lang))).sort((a, b) => scoreVoice(b, "zh-TW") - scoreVoice(a, "zh-TW"));
          const enVoices = cachedVoices.filter(v => normalizeVoiceLang(v.lang).startsWith("en")).sort((a, b) => scoreVoice(b, "en-US") - scoreVoice(a, "en-US"));
          const overrides = state.prefs.voiceOverrides || {}, autoZh = pickBestVoice("zh-TW"), autoEn = pickBestVoice("en-US");

          body.innerHTML = `
            <div class="form-group">
              <label class="form-label" for="setApiKeyInput">Google Gemini API Key</label>
              <div style="display:flex; gap:8px;">
                <input id="setApiKeyInput" class="input" type="${showKey ? "text" : "password"}" value="${escapeHtml(state.prefs.apiKey)}" placeholder="AIza..." autocomplete="off" />
                <button type="button" class="btn btn-secondary" id="btnToggleKeyVis">${showKey ? "Hide" : "Show"}</button>
              </div>
              <small style="color:var(--text-muted); line-height:1.4;">Stored strictly in your browser's <code>localStorage</code>. Your key never leaves your device except when calling Google's Gemini API directly.</small>
            </div>
            <div class="form-group">
              <label class="form-label" for="setModelSelect">Gemini Model</label>
              <select id="setModelSelect" class="select">${GEMINI_MODELS.map(m => `<option value="${escapeHtml(m.id)}" ${state.prefs.model === m.id ? "selected" : ""}>${escapeHtml(m.label)}</option>`).join("")}</select>
            </div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <button type="button" class="btn btn-outline-primary btn-sm" id="btnTestGemini">Test API Connection</button>
              <span id="testApiStatus" style="font-size:.88rem; font-weight:600;"></span>
            </div>
            <label class="switch-label">
              <input type="checkbox" class="switch-input" id="chkSettingAiGrading" ${state.prefs.aiGrading ? "checked" : ""} />
              <span class="switch"></span><span>✨ Use Gemini AI to judge written answers (Learn &amp; Test)</span>
            </label>
            <hr style="border:none; border-top:1px solid var(--border); width:100%; margin:4px 0;" />
            <div class="form-group">
              <label class="form-label" for="setSpeechRate">Text-to-Speech Speed</label>
              <select id="setSpeechRate" class="select">
                <option value="0.75" ${Number(state.prefs.speechRate) === 0.75 ? "selected" : ""}>0.75x (Slow &amp; Clear)</option>
                <option value="1" ${Number(state.prefs.speechRate) === 1 ? "selected" : ""}>1.0x (Normal)</option>
                <option value="1.25" ${Number(state.prefs.speechRate) === 1.25 ? "selected" : ""}>1.25x (Fast)</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="setZhVoice">Chinese Voice (ZH-TW / Mandarin)</label>
              <div style="display:flex; gap:8px;">
                <select id="setZhVoice" class="select" style="flex:1;">
                  <option value="">Auto Best (${escapeHtml(autoZh ? `${autoZh.name} [${autoZh.lang}]` : "System Default")})</option>
                  ${zhVoices.map(v => `<option value="${escapeHtml(v.name)}" ${overrides["zh-TW"] === v.name ? "selected" : ""}>${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`).join("")}
                </select>
                <button type="button" class="btn btn-secondary btn-sm speak-btn" id="btnTestZhVoice">🔊 Test</button>
              </div>
              <small style="color:var(--text-muted);">Tip: Voices labeled "Google", "Natural", or "Online" sound much more natural than offline robotic voices.</small>
            </div>
            <div class="form-group">
              <label class="form-label" for="setEnVoice">English Voice (EN-US)</label>
              <div style="display:flex; gap:8px;">
                <select id="setEnVoice" class="select" style="flex:1;">
                  <option value="">Auto Best (${escapeHtml(autoEn ? `${autoEn.name} [${autoEn.lang}]` : "System Default")})</option>
                  ${enVoices.map(v => `<option value="${escapeHtml(v.name)}" ${overrides["en-US"] === v.name ? "selected" : ""}>${escapeHtml(v.name)} (${escapeHtml(v.lang)})</option>`).join("")}
                </select>
                <button type="button" class="btn btn-secondary btn-sm speak-btn" id="btnTestEnVoice">🔊 Test</button>
              </div>
            </div>
            <hr style="border:none; border-top:1px solid var(--border); width:100%; margin:4px 0;" />
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
              <button type="button" class="btn btn-danger btn-sm" id="btnClearAllData">Clear All Local Data</button>
              <button type="button" class="btn btn-primary" id="btnSaveSettings">Done</button>
            </div>
          `;

          body.querySelector("#setApiKeyInput").oninput = (e) => { state.prefs.apiKey = e.target.value.trim(); savePrefs(); };
          body.querySelector("#btnToggleKeyVis").onclick = () => { showKey = !showKey; renderBody(); };
          body.querySelector("#setModelSelect").onchange = (e) => { state.prefs.model = e.target.value; savePrefs(); };
          body.querySelector("#chkSettingAiGrading").onchange = (e) => { state.prefs.aiGrading = e.target.checked; savePrefs(); };
          body.querySelector("#setSpeechRate").onchange = (e) => { state.prefs.speechRate = Number(e.target.value); savePrefs(); };

          const bindVoice = (id, key) => {
            body.querySelector(id).onchange = (e) => {
              state.prefs.voiceOverrides = state.prefs.voiceOverrides || {};
              if (e.target.value) state.prefs.voiceOverrides[key] = e.target.value;
              else delete state.prefs.voiceOverrides[key];
              savePrefs();
            };
          };
          bindVoice("#setZhVoice", "zh-TW");
          bindVoice("#setEnVoice", "en-US");

          body.querySelector("#btnTestZhVoice").onclick = (e) => speakText("(n.) 水；有韌性的", "zh-TW", e.currentTarget);
          body.querySelector("#btnTestEnVoice").onclick = (e) => speakText("water, resilient", "en-US", e.currentTarget);
          body.querySelector("#btnTestGemini").onclick = async () => {
            const st = body.querySelector("#testApiStatus");
            st.style.color = "var(--text-muted)"; st.textContent = "Testing connection...";
            try {
              const reply = await callGemini({ parts: [{ text: "Reply with exactly the word OK." }], expectJson: false });
              st.style.color = "var(--green)"; st.textContent = `✓ Connected (${state.prefs.model}): "${String(reply).trim().slice(0, 30)}"`;
            } catch (err) {
              st.style.color = "var(--orange)"; st.textContent = err.message === "MISSING_KEY" ? "Enter an API key first." : err.message;
            }
          };
          body.querySelector("#btnClearAllData").onclick = async () => {
            if (await showConfirm("Clear All Data", "Delete ALL study sets, progress, and settings from this browser?", "Delete Everything")) {
              localStorage.removeItem(STORAGE_KEY_SETS); localStorage.removeItem(STORAGE_KEY_PREFS);
              state.prefs = { ...DEFAULT_PREFS }; state.sets = [createSampleSet()];
              saveSets(); applyTheme("light");
              modal.classList.add("hidden"); state.view = "home"; render();
              showToast("All local data cleared & sample set restored.");
            }
          };
          body.querySelector("#btnSaveSettings").onclick = () => { savePrefs(); modal.classList.add("hidden"); render(); showToast("Settings saved!", "success"); };
        };

        renderBody();
        modal.classList.remove("hidden");
      }

      function openTransferModal() {
        const modal = $("transferModal"), body = $("transferModalBody");
        body.innerHTML = `
          <div class="panel" style="background:var(--surface-secondary);">
            <h3 style="margin:0 0 6px; font-size:1rem;">Export Backup (.json)</h3>
            <p style="margin:0 0 12px; font-size:.9rem; color:var(--text-muted);">Download all ${state.sets.length} study sets (including starred cards and mastery progress) to move between your Android phone and computer.</p>
            <button type="button" class="btn btn-primary" id="btnExportJson">Download Backup (.json)</button>
          </div>
          <div class="panel" style="background:var(--surface-secondary);">
            <h3 style="margin:0 0 6px; font-size:1rem;">Import Backup (.json)</h3>
            <p style="margin:0 0 12px; font-size:.9rem; color:var(--text-muted);">Choose whether to merge imported sets with your current library or replace everything.</p>
            <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:12px;">
              <label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;"><input type="radio" name="importMode" value="merge" checked /> Merge (Keep existing sets)</label>
              <label style="display:inline-flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;"><input type="radio" name="importMode" value="replace" /> Replace all sets</label>
            </div>
            <input type="file" id="importJsonInput" accept="application/json,.json" class="hidden" />
            <button type="button" class="btn btn-outline-primary" id="btnTriggerImport">Select .json Backup File</button>
          </div>
        `;

        body.querySelector("#btnExportJson").onclick = () => {
          const blob = new Blob([JSON.stringify({ app: "LexiFlash", version: 1, exportedAt: new Date().toISOString(), sets: state.sets }, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = Object.assign(document.createElement("a"), { href: url, download: `lexiflash-backup-${new Date().toISOString().slice(0, 10)}.json` });
          document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
          showToast("Backup downloaded!", "success");
        };

        body.querySelector("#btnTriggerImport").onclick = () => body.querySelector("#importJsonInput").click();
        body.querySelector("#importJsonInput").onchange = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const mode = body.querySelector('input[name="importMode"]:checked').value;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              const importedSets = Array.isArray(parsed) ? parsed : parsed.sets;
              if (!Array.isArray(importedSets)) throw new Error("Invalid backup format.");

              const normalized = importedSets.filter(s => s && Array.isArray(s.cards)).map(s => ({
                id: s.id || uid(), title: String(s.title || "Imported Set"), description: String(s.description || ""),
                folder: String(s.folder || ""), termLang: s.termLang || "en-US", defLang: s.defLang || "zh-TW",
                createdAt: s.createdAt || Date.now(), updatedAt: Date.now(),
                cards: s.cards.map(c => ({ id: c.id || uid(), term: String(c.term || ""), def: String(c.def || ""), starred: Boolean(c.starred), mastery: Number(c.mastery) || 0 }))
              }));

              if (mode === "replace") state.sets = normalized;
              else {
                const existingIds = new Set(state.sets.map(s => s.id));
                for (const item of normalized) {
                  if (existingIds.has(item.id)) item.id = uid();
                  state.sets.unshift(item);
                }
              }
              saveSets(); modal.classList.add("hidden"); state.view = "home"; render();
              showToast(`Imported ${normalized.length} study sets!`, "success");
            } catch (err) { showToast("Failed to import JSON: " + err.message, "error"); }
          };
          reader.readAsText(file);
        };
        modal.classList.remove("hidden");
      }

      /* =====================================================================
         10. GLOBAL EVENTS, SHORTCUTS & BOOTSTRAP
      ===================================================================== */
      function wireGlobalEvents() {
        $("btnGoHome").onclick = () => { state.view = "home"; render(); };

        const searchInput = $("globalSearchInput"), clearBtn = $("btnClearSearch");
        searchInput.oninput = (e) => {
          state.searchQuery = e.target.value;
          clearBtn.classList.toggle("hidden", !state.searchQuery);
          if (state.view !== "home") state.view = "home";
          render();
        };
        clearBtn.onclick = () => { state.searchQuery = ""; searchInput.value = ""; clearBtn.classList.add("hidden"); render(); };

        $("btnHeaderCreate").onclick = () => openEditor(null);
        $("btnHeaderScan").onclick = () => openScannerModal(state.view === "editor" ? "EDITOR" : state.view === "set" ? state.study.setId : null);
        $("btnThemeToggle").onclick = () => { applyTheme(state.prefs.theme === "dark" ? "light" : "dark"); savePrefs(); };
        $("btnHeaderTransfer").onclick = openTransferModal;
        $("btnHeaderSettings").onclick = openSettingsModal;

        $("btnCloseScanner").onclick = closeScannerModal;
        $("btnCloseSettings").onclick = () => $("settingsModal").classList.add("hidden");
        $("btnCloseTransfer").onclick = () => $("transferModal").classList.add("hidden");
        $("scannerModal").onclick = (e) => { if (e.target.id === "scannerModal") closeScannerModal(); };
        $("settingsModal").onclick = (e) => { if (e.target.id === "settingsModal") e.target.classList.add("hidden"); };
        $("transferModal").onclick = (e) => { if (e.target.id === "transferModal") e.target.classList.add("hidden"); };

        window.addEventListener("paste", (e) => {
          if (!state.scanner.open || state.scanner.step !== "capture") return;
          for (const item of (e.clipboardData?.items || [])) {
            if (item.type.startsWith("image/")) {
              const file = item.getAsFile();
              if (file) { e.preventDefault(); handleUploadedImageFile(file); break; }
            }
          }
        });

        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (state.scanner.open) closeScannerModal();
            $("settingsModal").classList.add("hidden");
            $("transferModal").classList.add("hidden");
            return;
          }
          if (state.scanner.open || !$("settingsModal").classList.contains("hidden") || !$("transferModal").classList.contains("hidden")) return;
          if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName)) return;

          if (state.view === "set" && state.study.mode === "flashcards" && !state.study.fc.finished) {
            const k = e.key.toLowerCase();
            if (e.code === "Space") { e.preventDefault(); $("flashcard3d")?.click(); }
            else if (e.key === "ArrowLeft") { e.preventDefault(); ($("btnFcLearning") || $("btnFcPrev"))?.click(); }
            else if (e.key === "ArrowRight") { e.preventDefault(); ($("btnFcKnow") || $("btnFcNext"))?.click(); }
            else if (k === "s") { e.preventDefault(); $("fcStarFront")?.click(); }
            else if (k === "a") { e.preventDefault(); $(state.study.fc.flipped ? "fcSpeakBack" : "fcSpeakFront")?.click(); }
          }
        });

        window.addEventListener("beforeunload", stopCameraStream);
      }

      loadData();
      wireGlobalEvents();
      render();
    })();
  </script>
</body>
</html>
